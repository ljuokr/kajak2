// One river silhouette shared by all water layers in each render.
let riverSurface = null;
const flowTraces = [];
let bendTintCanvas = null;

function buildRiverSurface() {
  const path = new Path2D();
  for (let y = 0; y <= HEIGHT; y += 4) {
    const [l] = waterEdges(y + camY);
    if (y === 0) path.moveTo(l,y); else path.lineTo(l,y);
  }
  for (let y = HEIGHT; y >= 0; y -= 4) path.lineTo(waterEdges(y + camY)[1],y);
  path.closePath(); return path;
}
function seedFlowTrace(p, i, full = false) {
  p.y = full ? camY + (i * 97.13 % HEIGHT) : camY + HEIGHT + 12;
  const [l,r] = waterEdges(p.y);
  p.x = l + 8 + ((i * .618034) % 1) * Math.max(1,r-l-16);
  p.seed = i; p.age = (i * 11) % 90;
}
function seedEddyFoam(p, i, e, stagger = false) {
  const cell=e.cells[i%2], a=i*2.399963;
  const radius=.35+(i%5)*.085;
  p.x=cell.x+e.nx*Math.cos(a)*cell.rx*radius+e.tx*Math.sin(a)*cell.ry*radius;
  p.y=cell.y+e.ny*Math.cos(a)*cell.rx*radius+e.ty*Math.sin(a)*cell.ry*radius;
  p.age=stagger?(i*31)%240:0;
}
function updateFlowVisuals() {
  if (!flowTraces.length) for(let i=0;i<130;i++) { const p={}; seedFlowTrace(p,i,true); flowTraces.push(p); }
  for (const p of flowTraces) {
    const f=sampleCurrent(p.x,p.y);
    p.x += f.x; p.y += f.y; p.age++;
    const [l,r]=waterEdges(p.y);
    if(p.y<camY-30 || p.y>camY+HEIGHT+40 || p.x<l+2 || p.x>r-2 || p.age>720) seedFlowTrace(p,p.seed,true);
  }
  for(const rock of obstacles){
    if(rock.type!=='rock'||rock.y<camY-220||rock.y>camY+HEIGHT+280)continue;
    const e=getEddyGeometry(rock);
    if(!rock.eddyFoam)rock.eddyFoam=Array.from({length:20},(_,i)=>{const p={};seedEddyFoam(p,i,e,true);return p;});
    rock.eddyFoam.forEach((p,i)=>{
      const f=sampleCurrent(p.x,p.y);p.x+=f.x;p.y+=f.y;p.age++;
      const dx=p.x-e.x,dy=p.y-e.y;
      const q=((dx*e.nx+dy*e.ny)/e.rx)**2+((dx*e.tx+dy*e.ty)/e.ry)**2;
      const [l,r]=waterEdges(p.y);
      if(q>1.04||p.x<l+3||p.x>r-3||p.age>520)seedEddyFoam(p,i,e);
    });
  }
}

function drawWater() {
  riverSurface = buildRiverSurface();
  ctx.save(); ctx.clip(riverSurface);
  const gradient=ctx.createLinearGradient(0,0,0,HEIGHT);
  for(let i=0;i<=20;i++) {
    const y=camY+i*HEIGHT/20, [l,r]=waterEdges(y);
    const f=sampleCurrent((l+r)/2,y), k=Math.min(1,f.speed/2.7);
    gradient.addColorStop(i/20,`rgb(${Math.round(42-20*k)},${Math.round(150-43*k)},${Math.round(158-27*k)})`);
  }
  ctx.fillStyle=gradient;ctx.fillRect(0,0,WIDTH,HEIGHT);
  // A smoothly interpolated colour field distinguishes deep outer bends from
  // pale inner shoals, without horizontal seams between sampled river sections.
  if(!bendTintCanvas){bendTintCanvas=document.createElement('canvas');bendTintCanvas.width=40;bendTintCanvas.height=72;}
  const tint=bendTintCanvas.getContext('2d'),map=tint.createImageData(40,72);
  for(let row=0;row<72;row++){
    const ch=currentChannel(WIDTH/2,camY+(row+.5)*HEIGHT/72);
    for(let col=0;col<40;col++){
      const across=Math.max(0,Math.min(1,((col+.5)*WIDTH/40-ch.left)/ch.width));
      const bias=(ch.bend||0)*(across*2-1),i=(row*40+col)*4,outer=bias>0;
      map.data[i]=outer?5:188;map.data[i+1]=outer?61:219;map.data[i+2]=outer?89:163;
      map.data[i+3]=Math.round(Math.abs(bias)*.34*255);
    }
  }
  tint.putImageData(map,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(bendTintCanvas,0,0,WIDTH,HEIGHT);
  // Translucent shallows hug the banks instead of tinting the entire river.
  for(const side of [0,1]) for(let layer=0;layer<4;layer++) {
    ctx.beginPath();
    const inset=5+layer*7;
    for(let y=0;y<=HEIGHT;y+=8){const [l,r]=waterEdges(y+camY),x=side?r-inset:l+inset;if(!y)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
    ctx.strokeStyle=`rgba(179,232,192,${.12-layer*.023})`;ctx.lineWidth=9;ctx.stroke();
  }
  ctx.strokeStyle='rgba(6,53,59,.30)';ctx.lineWidth=3;ctx.stroke(riverSurface);
  ctx.restore();
}
function drawWaves() {
  ctx.save(); ctx.clip(riverSurface);ctx.lineCap='round';
  // World-anchored broken reflections avoid the old horizontal grid.
  const rowStart=Math.floor(camY/33)*33;
  for(let wy=rowStart;wy<camY+HEIGHT+33;wy+=33){
    const [l,r]=waterEdges(wy);
    for(let i=0;i<3;i++){
      const u=.16+i*.31+Math.sin(wy*.031+i)*.07,x=l+(r-l)*u;
      const f=sampleCurrent(x,wy),a=.045+Math.sin(tick*.025+wy*.1+i)*.025;
      ctx.strokeStyle=`rgba(219,250,226,${a})`;ctx.lineWidth=.8;
      ctx.beginPath();ctx.moveTo(x-5,wy-camY);ctx.quadraticCurveTo(x,wy-camY-1.5,x+7,wy-camY);ctx.stroke();
      if(f.rapid>.2){
        const q=Math.sin(wy*.73+i*21)*5;
        ctx.strokeStyle=`rgba(233,255,250,${.10+f.rapid*.19})`;ctx.lineWidth=1.1;
        ctx.beginPath();ctx.moveTo(x-6,wy-camY+q);ctx.quadraticCurveTo(x,wy-camY+q-5,x+7,wy-camY+q);ctx.stroke();
      }
    }
  }
  for(const p of flowTraces){
    const f=sampleCurrent(p.x,p.y),norm=Math.max(.08,f.speed),outer=Math.max(0,f.bankBias||0),length=4+Math.min(17,norm*5)+outer*5;
    const pulse=.65+.35*Math.sin(p.age*.07+p.seed);
    ctx.strokeStyle=`rgba(222,255,245,${(.18+f.rapid*.23+outer*.18)*pulse})`;
    ctx.lineWidth=f.rapid>.5?1.5:.95;ctx.beginPath();ctx.moveTo(p.x,p.y-camY);
    ctx.lineTo(p.x-f.x/norm*length,p.y-camY-f.y/norm*length);ctx.stroke();
  }
  ctx.restore();
}
function drawEddy(o) {
  const e=getEddyGeometry(o);
  if(!e || e.y-camY<-e.ry*2 || e.y-camY>HEIGHT+e.ry*2)return;
  ctx.save();ctx.clip(riverSurface);ctx.lineCap='round';
  ctx.save();ctx.translate(e.x,e.y-camY);ctx.rotate(e.angle);
  ctx.scale(e.rx,e.ry);
  const glow=ctx.createRadialGradient(0,0,.1,0,0,1);
  glow.addColorStop(0,'rgba(149,233,190,.33)');glow.addColorStop(.65,'rgba(128,219,187,.19)');glow.addColorStop(1,'rgba(128,219,187,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,1,0,Math.PI*2);ctx.fill();ctx.restore();
  // Equal arc-length steps make the return paths readable even at low flow.
  // Direction and curvature are sampled from the very same field as the boat.
  for(const cell of e.cells)for(let i=0;i<4;i++){
    const a=i*Math.PI/2;
    let x=cell.x+e.nx*Math.cos(a)*cell.rx*.42+e.tx*Math.sin(a)*cell.ry*.42;
    let y=cell.y+e.ny*Math.cos(a)*cell.rx*.42+e.ty*Math.sin(a)*cell.ry*.42;
    let dx=0,dy=0;
    ctx.beginPath();ctx.moveTo(x,y-camY);
    for(let j=0;j<30;j++){
      const f=sampleCurrent(x,y),step=2.4/Math.max(.09,f.speed);
      dx=f.x*step;dy=f.y*step;x+=dx;y+=dy;ctx.lineTo(x,y-camY);
    }
    ctx.strokeStyle=`rgba(223,255,230,${.4+.08*Math.sin(tick*.016+i)})`;ctx.lineWidth=1.3;ctx.stroke();
    if(i%2===0&&Math.hypot(dx,dy)>.1){
      const a=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(x-4*Math.cos(a-.55),y-camY-4*Math.sin(a-.55));ctx.lineTo(x,y-camY);ctx.lineTo(x-4*Math.cos(a+.55),y-camY-4*Math.sin(a+.55));ctx.stroke();
    }
  }
  // Small foam flecks circulate and leave the eddy with the actual water.
  for(const p of o.eddyFoam||[]){
    const f=sampleCurrent(p.x,p.y),norm=Math.max(.09,f.speed);
    const fade=Math.min(1,p.age/24,(520-p.age)/55);
    ctx.strokeStyle=`rgba(242,255,222,${.8*Math.max(0,fade)})`;ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(p.x,p.y-camY);ctx.lineTo(p.x-f.x/norm*3.8,p.y-camY-f.y/norm*3.8);ctx.stroke();
  }
  // Bow foam sits on the upstream face of the stone.
  ctx.strokeStyle='rgba(232,255,244,.7)';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.ellipse(o.x,o.y-camY,(o.radX||o.rad)+3,(o.radY||o.rad)+3,o.rockRot||0,.1,Math.PI-.1);ctx.stroke();
  ctx.restore();
}

function drawKayakWake() {
  if(gameOver || player.capsized)return;
  const current=sampleCurrent(player.x,player.y),vx=player.vx-current.x,vy=player.vy-current.y;
  const speed=Math.hypot(vx,vy); if(speed<.15)return;
  ctx.save();ctx.clip(riverSurface);ctx.translate(player.x,player.y-camY);
  ctx.rotate(Math.atan2(vx,-vy));
  for(let i=0;i<3;i++){
    const age=(tick*.65+i*13)%38,spread=9+age*.42;
    ctx.strokeStyle=`rgba(230,255,246,${(1-age/38)*Math.min(.4,speed*.15)})`;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(-spread,25+age);ctx.quadraticCurveTo(0,34+age,spread,25+age);ctx.stroke();
  }

// Stable world coordinates keep all small details fixed while the camera glides.
function shoreHash(n) { const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v); }
function shoreWidths(y,side) {
  const p=side*2.7;
  const cove=(.5+.5*Math.sin(y*.009+p))**2;
  return {sand:9+cove*16+Math.sin(y*.045+p)*2,meadow:44+cove*28+Math.sin(y*.018+p)*10};
}
function shoreEllipse(x,y,rx,ry,color,angle=0) {
  ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,angle,0,Math.PI*2);ctx.fill();
}
function drawShoreStone(x,y,r,seed) {
  ctx.save();ctx.translate(x,y);ctx.rotate((seed-.5)*1.4);
  shoreEllipse(1.5,2,r*1.15,r*.68,'rgba(36,46,34,.19)');
  ctx.fillStyle=seed>.55?'#989d8a':'#b2ae97';ctx.beginPath();
  ctx.moveTo(-r,-r*.2);ctx.lineTo(-r*.4,-r*.65);ctx.lineTo(r*.45,-r*.55);
  ctx.lineTo(r,r*.04);ctx.lineTo(r*.5,r*.6);ctx.lineTo(-r*.55,r*.5);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(246,241,207,.72)';ctx.lineWidth=Math.max(.6,r*.14);
  ctx.beginPath();ctx.moveTo(-r*.72,-r*.24);ctx.lineTo(-r*.28,-r*.48);ctx.lineTo(r*.35,-r*.4);ctx.stroke();
  if(r>6)shoreEllipse(-r*.38,-r*.03,r*.3,r*.18,'#7d9365',-.3);
  ctx.restore();
}
function drawGrassTuft(x,y,seed=.5,reed=false) {
  ctx.save();ctx.translate(x,y);
  const h=reed?12+seed*9:5+seed*5;
  const bend=Math.sin(tick*.016+seed*15)*.7;
  ctx.lineCap='round';ctx.lineWidth=reed?1.1:.8;
  for(let j=-2;j<=2;j++){
    ctx.strokeStyle=j%2?'#a4b877':'#567a4b';ctx.beginPath();ctx.moveTo(j*.8,2);
    ctx.quadraticCurveTo(j*1.5+bend,-h*.4,j*2.2+bend,-h*(.65+(2-Math.abs(j))*.17));ctx.stroke();
    if(reed&&Math.abs(j)===1){ctx.strokeStyle='#897247';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(j*2.2+bend,-h*.75);ctx.lineTo(j*2.2+bend+.3,-h*.96);ctx.stroke();ctx.lineWidth=1.1;}
  }
  ctx.restore();
}
function drawShoreBush(x,y,r,seed) {
  shoreEllipse(x+3,y+4,r*1.2,r*.64,'rgba(22,48,33,.17)');
  for(let j=0;j<6;j++){
    const a=j*2.4+seed*4,dx=Math.cos(a)*r*.46,dy=Math.sin(a)*r*.32;
    shoreEllipse(x+dx,y+dy,r*.61,r*.5,j%2?'#557d50':'#426c4d',a);
    shoreEllipse(x+dx-r*.14,y+dy-r*.16,r*.31,r*.22,'rgba(152,178,101,.42)',a);
  }
}
function drawBanks() {
  for(const side of [0,1]) {
    const dir=side===0?-1:1;
    const edgeAt=y=>waterEdges(y)[side];
    const land=new Path2D();
    land.moveTo(side?WIDTH:0,0);
    for(let y=0;y<=HEIGHT;y+=4)land.lineTo(edgeAt(y+camY),y);
    land.lineTo(side?WIDTH:0,HEIGHT);land.closePath();
    ctx.save();ctx.clip(land);
    ctx.fillStyle='#355744';ctx.fillRect(0,0,WIDTH,HEIGHT);
    const band=(width,color)=>{
      const path=new Path2D();
      for(let y=0;y<=HEIGHT;y+=4){const e=edgeAt(y+camY);if(y===0)path.moveTo(e,y);else path.lineTo(e,y);}
      for(let y=HEIGHT;y>=0;y-=4){const wy=y+camY;path.lineTo(edgeAt(wy)+dir*width(wy),y);}
      path.closePath();ctx.fillStyle=color;ctx.fill(path);
    };
    // Broad, irregular meadow edges and small sandy coves replace uniform strips.
    band(y=>shoreWidths(y,side).meadow+20,'#486e4d');
    band(y=>shoreWidths(y,side).meadow+7,'#658652');
    band(y=>shoreWidths(y,side).meadow,'#819960');
    band(y=>shoreWidths(y,side).sand+13+Math.sin(y*.041+side)*3,'#a5ae79');
    band(y=>shoreWidths(y,side).sand+3,'#c2bd90');
    band(y=>shoreWidths(y,side).sand,'#d7cba5');
    band(y=>3.4+Math.sin(y*.067+side)*1.2,'#929b81');
    // Soft patches, leaves, gravel and isolated larger stones are deterministic.
    const landingClear=wy=>gameOver && side===(player.beachSide==='L'?0:1) && Math.abs(wy-(player.beachAnchorY??player.y))<106;
    const first=Math.floor((camY-35)/23)*23;
    for(let wy=first;wy<camY+HEIGHT+35;wy+=23){
      if(landingClear(wy))continue;
      const seed=wy*1.73+side*127,hash=shoreHash(seed),y=wy-camY;
      const edge=edgeAt(wy),widths=shoreWidths(wy,side);
      if(hash>.32){
        const x=edge+dir*(widths.sand+12+hash*32);
        shoreEllipse(x,y,10+hash*13,3+hash*4,'rgba(185,192,121,.17)',hash);
      }
      for(let i=0;i<5;i++){
        const h=shoreHash(seed+i*19.2),py=wy+(h-.5)*20;
        const sand=shoreWidths(py,side).sand,px=edgeAt(py)+dir*(3+h*(sand-4));
        if(i<2&&h>.3)drawShoreStone(px,py-camY,1.3+h*2,h);
        else shoreEllipse(px,py-camY,.55+h*.9,.35+h*.55,'rgba(110,109,78,.29)',h*3);
      }
      if(hash>.2){
        const py=wy+shoreHash(seed+11)*13,x=edgeAt(py)+dir*(shoreWidths(py,side).sand+4+hash*15);
        drawGrassTuft(x,py-camY,hash);
      }
      // Reeds grow in small groups above the waterline.
      if(hash>.85){
        for(let i=0;i<3;i++)drawGrassTuft(edge+dir*(5+i*2),y+i*4,shoreHash(seed+i),true);
      }
      if(hash<.17){
        const x=edge+dir*(widths.sand+18+hash*50);
        for(let i=0;i<3;i++){
          const dx=(shoreHash(seed+i+31)-.5)*12,dy=(shoreHash(seed+i+51)-.5)*10;
          ctx.strokeStyle='#60834d';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(x+dx,y+dy+3);ctx.lineTo(x+dx,y+dy-2);ctx.stroke();
          shoreEllipse(x+dx,y+dy-2,1.7,1.5,hash<.085?'#eee8be':'#d5b9a6');
          shoreEllipse(x+dx,y+dy-2,.65,.65,'#d5b761');
        }
      }
    }
    const clusterStart=Math.floor((camY-50)/107)*107;
    for(let wy=clusterStart;wy<camY+HEIGHT+50;wy+=107){
      if(landingClear(wy)||landingClear(wy+60))continue;
      const h=shoreHash(wy+side*891),py=wy+h*29,x=edgeAt(py),w=shoreWidths(py,side);
      if(h>.28)drawShoreBush(x+dir*(w.sand+26+h*31),py-camY,7+h*8,h);
      if(h<.48){
        const px=x+dir*(w.sand*.7+3);
        drawShoreStone(px,py-camY,4+h*9,h);
        drawShoreStone(px+dir*7,py-camY+8,2.5+h*4,1-h);
      }
      // Distant foliage breaks up larger areas of the bank.
      if(h>.2)drawShoreBush(x+dir*(w.meadow+30),py-camY+44,15+h*7,1-h);
    }
    ctx.restore();
  }
}

function drawFisherman(fisherman) {
  const y = fisherman.y - camY;
  if (y < -200 || y > HEIGHT + 100) return;
  const [L, R] = waterEdges(fisherman.y);
  // Fischer muss IMMER ausserhalb des Wassers stehen. Mindestabstand 15 px
  // zur Uferkante; falls das Ufer so nah am Screen-Rand ist, dass der Fischer
  // zwischen Wasser und Bildschirmrand gequetscht wäre, lieber gar nicht zeichnen.
  const edgeGap = 15;
  let adjustedX;
  if (fisherman.side === 'L') {
    const desired = L - 40;
    adjustedX = Math.max(20, desired);
    if (adjustedX > L - edgeGap) return;
  } else {
    const desired = R + 40;
    adjustedX = Math.min(WIDTH - 20, desired);
    if (adjustedX < R + edgeGap) return;
  }

  // Flash-Effekt: nach Berührung für 3 Sekunden gold pulsierend.
  const flashDuration = 180;
  const isFlashing = fisherman.touched && (tick - fisherman.flashTime < flashDuration);
  const flashIntensity = isFlashing ? Math.abs(Math.sin((tick - fisherman.flashTime) * 0.15)) : 0;
  const flashOn = isFlashing && flashIntensity > 0.5;

  const scale = 0.4;
  ctx.save();
  ctx.translate(adjustedX, y);
  ctx.scale(scale, scale);
  if (fisherman.side === 'R') ctx.scale(-1, 1);

  // Grounding shadow, muted waders and a fishing vest fit the natural bank.
  ctx.fillStyle = 'rgba(45,62,38,.2)';
  ctx.beginPath(); ctx.ellipse(5, 146, 48, 10, -.08, 0, Math.PI * 2); ctx.fill();
  // Beine (Hose)
  ctx.fillStyle = '#53695d';
  ctx.strokeStyle = '#354c41';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-18, 60); ctx.lineTo(-12, 60);
  ctx.lineTo(-28, 140); ctx.lineTo(-40, 138);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(12, 60); ctx.lineTo(18, 60);
  ctx.lineTo(32, 138); ctx.lineTo(20, 140);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Stiefel
  ctx.fillStyle = '#484937';
  ctx.beginPath(); ctx.ellipse(-34, 142, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(26, 142, 12, 5, 0, 0, Math.PI * 2); ctx.fill();

  // Oberkörper (T-Shirt / Weste)
  const shirtGrad = ctx.createLinearGradient(-24, -30, 24, 60);
  shirtGrad.addColorStop(0, '#a29c66');
  shirtGrad.addColorStop(1, '#74734b');
  ctx.fillStyle = shirtGrad;
  ctx.strokeStyle = '#555a39';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-24, -28);
  ctx.quadraticCurveTo(-28, 30, -20, 62);
  ctx.lineTo(20, 62);
  ctx.quadraticCurveTo(28, 30, 24, -28);
  ctx.quadraticCurveTo(0, -32, -24, -28);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Seams, pockets and a small fly clipped to the vest.
  ctx.strokeStyle = '#d2c68b'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-2, -24); ctx.lineTo(-2, 58); ctx.stroke();
  ctx.fillStyle = '#bbb17b';
  ctx.beginPath(); ctx.roundRect(-19, 5, 14, 18, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(5, 5, 14, 18, 2); ctx.fill();
  ctx.strokeStyle = '#74704c'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-18, 9); ctx.lineTo(-6, 9); ctx.moveTo(6, 9); ctx.lineTo(18, 9); ctx.stroke();
  ctx.fillStyle = '#c17244'; ctx.beginPath(); ctx.ellipse(11, -13, 3, 5, .6, 0, Math.PI * 2); ctx.fill();
  // Arme (Haut)
  ctx.fillStyle = '#e8b58a';
  ctx.strokeStyle = '#a47b51';
  ctx.lineWidth = 2;
  // linker Arm hängt
  ctx.beginPath();
  ctx.moveTo(-22, -10);
  ctx.quadraticCurveTo(-40, 10, -36, 34);
  ctx.lineTo(-28, 34);
  ctx.quadraticCurveTo(-32, 10, -14, -10);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // rechter Arm hält Rute
  ctx.beginPath();
  ctx.moveTo(14, -10);
  ctx.quadraticCurveTo(36, 4, 44, 22);
  ctx.lineTo(36, 28);
  ctx.quadraticCurveTo(30, 10, 22, -10);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Hals
  ctx.fillStyle = '#e8b58a';
  ctx.fillRect(-5, -36, 10, 10);

  // Kopf — bei Flash rot pulsierend, sonst Hautfarbe.
  if (flashOn) {
    ctx.shadowColor = '#ff2020';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#e52020';
    ctx.strokeStyle = '#7a0a0a';
  } else {
    ctx.fillStyle = '#e8b58a';
    ctx.strokeStyle = '#a47b51';
  }
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -50, 15, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  if (flashOn) ctx.shadowBlur = 0;

  // Bart (Fischer-Charakter)
  ctx.fillStyle = '#e1d9ba';
  ctx.beginPath();
  ctx.ellipse(0, -42, 10, 6, 0, 0, Math.PI);
  ctx.fill();

  ctx.fillStyle = '#34493e';
  ctx.beginPath(); ctx.arc(6, -51, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#b5865e'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(8, -46); ctx.lineTo(12, -44); ctx.lineTo(7, -43); ctx.stroke();
  // Hut mit Krempe
  ctx.fillStyle = '#87704b';
  ctx.strokeStyle = '#5c5438';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, -61, 22, 4, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-12, -61);
  ctx.quadraticCurveTo(-14, -78, 0, -78);
  ctx.quadraticCurveTo(14, -78, 12, -61);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#56614b';
  ctx.fillRect(-12, -64, 24, 2);

  ctx.strokeStyle = '#b1a376'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-9, -72); ctx.quadraticCurveTo(0, -78, 7, -72); ctx.stroke();
  // Wooden handle and small brass reel sit at the unchanged rod origin.
  ctx.strokeStyle = '#755337'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(34, 28); ctx.lineTo(51, 10); ctx.stroke();
  ctx.fillStyle = '#a79965'; ctx.strokeStyle = '#4b573e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(42, 32, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  if (fisherman.rodInWater) {
    // Rute ins Wasser geschwungen, mit Schnur und Schwimmer.
    const rodGrad = ctx.createLinearGradient(40, 20, 410, 80);
    rodGrad.addColorStop(0, '#6b4528');
    rodGrad.addColorStop(1, '#b88a5a');
    ctx.strokeStyle = rodGrad;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(40, 20);
    ctx.quadraticCurveTo(190, -40, 410, 80);
    ctx.stroke();

    // Angelschnur
    ctx.strokeStyle = 'rgba(80,80,80,0.85)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(410, 80);
    ctx.quadraticCurveTo(460, 160, 410, 240);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(225,244,222,.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(410, 248, 22, 7, 0, 0, Math.PI * 2); ctx.stroke();
    // Schwimmer (Bobber)
    ctx.fillStyle = '#d63a1a';
    ctx.strokeStyle = '#3a0f04';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(410, 240, 10, 16, Math.PI / 8, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(410, 240, 10, 16, Math.PI / 8, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = '#fafafa';
    ctx.fillRect(395, 240, 40, 20);
    ctx.restore();
    ctx.strokeStyle = '#484937';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(405, 225); ctx.lineTo(402, 215);
    ctx.stroke();
  } else {
    // Rute am Ufer hochgehalten / geschultert — keine Schnur im Wasser.
    const rodGrad = ctx.createLinearGradient(40, 20, 260, -220);
    rodGrad.addColorStop(0, '#6b4528');
    rodGrad.addColorStop(1, '#b88a5a');
    ctx.strokeStyle = rodGrad;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(40, 20);
    ctx.quadraticCurveTo(160, -100, 260, -220);
    ctx.stroke();
    // Aufgewickelte Schnur an der Rutenspitze
    ctx.strokeStyle = 'rgba(80,80,80,0.7)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      ctx.moveTo(260, -220 + i * 3);
      ctx.lineTo(275, -218 + i * 3);
    }
    ctx.stroke();
  }

  ctx.restore();
}

function drawPoliceBoat(boat) {
  const x = boat.x, yWater = boat.y - camY;
  const jumpOff = boat.jumpOffset || 0, y = yWater - jumpOff;
  // Foam and shadow remain on the river surface throughout the jump.
  ctx.save(); ctx.translate(x, yWater);
  const shrink = 1 - Math.min(.55, jumpOff / 70);
  ctx.fillStyle = `rgba(15,52,49,${.24 * shrink})`;
  ctx.beginPath(); ctx.ellipse(2, 14, 38 * shrink, 8 * shrink, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `rgba(225,246,228,${jumpOff > .5 ? .22 : .6})`; ctx.lineWidth = 1.2;
  for (const side of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(side * 6, -23); ctx.quadraticCurveTo(side * 37, -7, side * 37, 17); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(side * 18, 19); ctx.quadraticCurveTo(side * 25, 30, side * 31, 39); ctx.stroke();
  }
  ctx.restore();
  ctx.save(); ctx.translate(x, y); ctx.scale(.6, .6);
  if (jumpOff > .5 && boat.jumpState === 3) {
    const phase = Math.min(1, (boat.jumpTimer || 0) / 22);
    ctx.rotate((.5 - phase) * .35);
  }
  const hull = ctx.createLinearGradient(-48, -30, 48, 28);
  hull.addColorStop(0, '#f3eed8'); hull.addColorStop(.45, '#dce2d3'); hull.addColorStop(1, '#8fa5a0');
  ctx.fillStyle = hull; ctx.strokeStyle = '#365754'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -38); ctx.quadraticCurveTo(40, -30, 58, 0);
  ctx.quadraticCurveTo(60, 22, 44, 28); ctx.lineTo(-44, 28);
  ctx.quadraticCurveTo(-60, 22, -58, 0); ctx.quadraticCurveTo(-40, -30, 0, -38);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#fff7dc'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-47, 22); ctx.quadraticCurveTo(-69, -3, 0, -34);
  ctx.quadraticCurveTo(37, -27, 53, -1); ctx.stroke();
  ctx.fillStyle = '#376f87';
  ctx.beginPath(); ctx.moveTo(-54, -2); ctx.quadraticCurveTo(-40, -18, 0, -22);
  ctx.quadraticCurveTo(40, -18, 54, -2); ctx.lineTo(54, 6);
  ctx.quadraticCurveTo(40, -10, 0, -14); ctx.quadraticCurveTo(-40, -10, -54, 6);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#d2b767'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-54, 7); ctx.quadraticCurveTo(-40, -9, 0, -13);
  ctx.quadraticCurveTo(40, -9, 54, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(27,62,61,.22)';
  ctx.beginPath(); ctx.roundRect(-22, 5, 48, 22, 4); ctx.fill();
  const cabin = ctx.createLinearGradient(0, 3, 0, 24);
  cabin.addColorStop(0, '#4e726e'); cabin.addColorStop(1, '#294d50');
  ctx.fillStyle = cabin; ctx.strokeStyle = '#274749'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-24, 22); ctx.lineTo(-20, 4); ctx.lineTo(20, 4); ctx.lineTo(24, 22);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#a9cdc5';
  ctx.beginPath(); ctx.moveTo(-16, 8); ctx.lineTo(16, 8); ctx.lineTo(18, 17); ctx.lineTo(-18, 17); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#deead5'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-13, 9); ctx.lineTo(-5, 9); ctx.moveTo(4, 9); ctx.lineTo(13, 9); ctx.stroke();
  ctx.strokeStyle = '#436761'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, 17); ctx.stroke();
  ctx.strokeStyle = '#3d5c53'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(26, 11); ctx.lineTo(31, -5); ctx.stroke();
  ctx.fillStyle = '#304c4c'; ctx.beginPath(); ctx.roundRect(-17, -2, 34, 6, 2); ctx.fill();
  const leftOn = Math.floor(boat.blinkPhase / 10) % 2 === 0;
  for (const side of [-1, 1]) {
    const on = side < 0 ? leftOn : !leftOn;
    if (on) {
      const glow = ctx.createRadialGradient(side * 9, 1, 1, side * 9, 1, 17);
      glow.addColorStop(0, side < 0 ? 'rgba(105,192,235,.65)' : 'rgba(239,126,91,.65)');
      glow.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(side * 9, 1, 17, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = on ? (side < 0 ? '#79c7e8' : '#f28565') : (side < 0 ? '#466d83' : '#795b52');
    ctx.beginPath(); ctx.roundRect(side * 9 - 6, -1.8, 12, 5.6, 2); ctx.fill();
    if (on) { ctx.fillStyle = '#f3f3df'; ctx.fillRect(side * 9 - 3, -.8, 5, 1); }
  }
  ctx.fillStyle = '#334b49'; ctx.beginPath(); ctx.roundRect(-8, 24, 16, 10, 3); ctx.fill();
  ctx.strokeStyle = '#8ba299'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-5, 27); ctx.lineTo(5, 27); ctx.moveTo(-5, 30); ctx.lineTo(5, 30); ctx.stroke();
  for (const side of [-1, 1]) {
    ctx.fillStyle = '#4e6660'; ctx.fillRect(side * 29 - 2, 23, 4, 6);
    ctx.fillStyle = '#e7e7cd'; ctx.fillRect(side * 29 - 3, 22, 6, 2);
  }
  ctx.restore();
  // Readable Slovenian deck sign: full screen-pixel font, upright even in jumps.
  const labelX=Math.max(53,Math.min(WIDTH-53,x));
  ctx.save();ctx.translate(labelX,y-13);
  ctx.fillStyle='#fffbed';ctx.strokeStyle='#284c53';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.roundRect(-50,-11,100,22,3);ctx.fill();ctx.stroke();
  ctx.font='900 16px Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#143c47';ctx.fillText('POLICIJA',0,.5);
  ctx.restore();
}


function draw() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  const skyGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
  skyGrad.addColorStop(0, '#87CEEB');
  skyGrad.addColorStop(0.6, '#A8D8E8');
  skyGrad.addColorStop(1, '#B8E2EC');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  drawBanks();
  drawWater();
  drawWaves();
  drawKayakWake();

  obstacles.forEach(o => o.type === 'rock' ? drawRock(o) : drawLog(o));
  collectibles.forEach(item => {
    if (item.type === 'banana') drawBanana(item);
    else if (item.type === 'riegel') drawRiegel(item);
  });
  fishes.forEach(drawFish);
  policeBoats.forEach(drawPoliceBoat);

  // Bäume VOR Kajak/Personen zeichnen, damit sie die Strand-Szene nicht verdecken.
  trees.forEach(drawTree);
  drawKayak();
  drawSplashes();
  fishermen.forEach(drawFisherman);
  drawScorePops();
  drawHUD();
}

// Fixed-Timestep-Loop: update() läuft fix bei 60 Hz, unabhängig von der
// Display-Refresh-Rate (60/120/144 Hz). So läuft das Spiel überall gleich schnell.
const FIXED_DT = 1000 / 60;
let _loopLastTime = 0;
let _loopAcc = 0;
let _loopError = null;
function loop(now) {
  if (manualClock) { requestAnimationFrame(loop); return; }
  if (!_loopLastTime) _loopLastTime = now || performance.now();
  const t = now || performance.now();
  const delta = Math.min(250, t - _loopLastTime);
  _loopLastTime = t;
  _loopAcc += delta;
  // Maximal 5 update()-Ticks pro Frame, verhindert "spiral of death" bei Lag.
  try {
    let steps = 0;
    if (paused) {
      // Pause: update() überspringen, Accumulator resetten. draw() läuft weiter,
      // damit das HUD (Pause-Button/Overlay) reagiert und Animationen wie der
      // Puls am Sound-Button weiter tickeln.
      _loopAcc = 0;
    } else {
      while (_loopAcc >= FIXED_DT && steps < 5) {
        update();
        _loopAcc -= FIXED_DT;
        steps++;
      }
      if (_loopAcc > FIXED_DT * 5) _loopAcc = 0;
    }
    draw();
  } catch (err) {
    _loopError = err;
    // Notfall-Rendering: Fehler sichtbar machen statt schwarzem Bildschirm.
    try {
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, WIDTH || 390, HEIGHT || 600);
      ctx.fillStyle = '#ff6a4a';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('Fehler in der Schleife:', 20, 40);
      ctx.fillStyle = '#fff';
      ctx.font = '12px monospace';
      const msg = String(err && err.stack || err).split('\n').slice(0, 12);
      msg.forEach((line, i) => ctx.fillText(line.slice(0, 60), 20, 70 + i * 16));
    } catch (_) {}
    console.error('Game loop error:', err);
  }
  requestAnimationFrame(loop);
}

function clearControls() {
  Object.keys(keys).forEach(k => keys[k] = false);
  touchTargetX = touchTargetY = null;
  joyActive = false; joyX = joyY = 0;
  document.querySelector('.joystick').classList.remove('dragging');
  document.querySelector('.paddle').setAttribute('transform', 'translate(90 90)');
}
function startAdventure(e) {
  e?.stopPropagation();
  hasStarted = true;
  document.getElementById('welcome').hidden = true;
  paused = false;
  _loopAcc = 0; _loopLastTime = 0;
  clearControls();
}
document.getElementById('start-btn').addEventListener('click', startAdventure);
const wasd = {w:'ArrowUp', a:'ArrowLeft', s:'ArrowDown', d:'ArrowRight'};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (wasd[k]) { e.preventDefault(); keys[wasd[k]] = true; }
  if (e.repeat) return;
  if (k === 'p' || e.code === 'Space') { e.preventDefault(); if (hasStarted) togglePause(); }
  if (k === 'r' && gameOver) init();
  if (k === 'f') {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  }
});
window.addEventListener('keyup', e => { if (wasd[e.key.toLowerCase()]) keys[wasd[e.key.toLowerCase()]] = false; });
function pauseOnLeave() { clearControls(); if (hasStarted && !gameOver) paused = true; }
window.addEventListener('blur', pauseOnLeave);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseOnLeave(); });
cvs.addEventListener('touchcancel', clearControls, {passive: true});
window.advanceTime = ms => {
  manualClock = true;
  for (let i = 0; i < Math.max(0, Math.round(ms / FIXED_DT)); i++) { if (!paused) update(); }
  draw();
};
window.render_game_to_text = () => JSON.stringify({
  version: 3, mode: !hasStarted ? 'start' : gameOver ? 'gameover' : paused ? 'paused' : player.capsized ? 'capsized' : 'playing',
  coordinates: 'World origin top-left; x right, y down; screenY = y - cameraY',
  tick, cameraY: camY, score, lives, distance: Math.floor(distance), difficulty,
  player: {x:player.x,y:player.y,vx:player.vx,vy:player.vy,w:player.w,h:player.h,invulnerable:player.invulnerable,
    contact: {kind:player.contactKind,ticks:player.contactTicks,limit:HULL_CONTACT_LIMIT}},
  baby: {present:true, location:gameOver ? 'on own cushion beside parents on shore' : player.capsized ? 'with parent in flotation ring' : 'centre seat',lifeJacket:true},
  ending: gameOver ? {title:'GAME OVER', arrangement:'separated campsite with beer and fire', shore:getBeachLayout(), kayakDrifting:true, paddle:{x:player.paddleX,y:player.paddleY}} : null,
  current:sampleCurrent(player.x,player.y), audio:getAudioStatus(),
  muted:soundMuted, code: [100,200,300].map((n,i)=>score>=n ? '324'[i] : '?').join(''),
  obstacles:obstacles.filter(o=>Math.abs(o.y-player.y)<420).map(o=>({type:o.type,x:o.x,y:o.y,r:o.rad,w:o.len,h:o.wd})),
  collectibles:collectibles.filter(o=>Math.abs(o.y-player.y)<420).map(o=>({type:o.type,x:o.x,y:o.y})),
  policeBoats:policeBoats.map(o=>({x:o.x,y:o.y})),
  fishermen:fishermen.filter(f=>Math.abs(f.y-player.y)<HEIGHT).map(f=>({side:f.side,y:f.y,rodInWater:f.rodInWater})),
  dolphins:fishes.map(f=>({x:f.x,y:f.y})), error:_loopError ? String(_loopError) : null
});
</script>
