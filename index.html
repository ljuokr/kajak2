<script>
/* ---------- Display constants ---------- */
const BASE_W = 390, BASE_H = 844;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');

let WIDTH, HEIGHT, bankWidth, riverWidth, meanderAmp, meanderWave;
const meanderPhase = Math.PI;
const BASE_FLOW = -0.82;
const PAD = 250;
const LOG_MARGIN = 20;
const MAX_PADDLE = Math.PI/3;

/* ---------- Game state ---------- */
const player = {
  x: 0, y: 0, w: 30, h: 68,
  vx: 0, vy: 0,
  capsized: false, capsizeTime: 0,
  invulnerable: false, invulnerableTime: 0,
  contactTicks: 0, contactLastTick: -1, contactKind: ''
};
const obstacles = [];
const trees = [];
const collectibles = [];
const scorePops = [];
const splashes = [];
const fishermen = [];
const fishes = [];
const policeBoats = [];
let lives = 3;
let score = 0;
let secretsRevealed = 0;
let distance = 0;
let startY = 0;
let gameOver = false;
let paused = false;
let hasStarted = false;
let loopStarted = false;
let manualClock = false;
let tick = 0;
let camY = 0;
let difficulty = 1;
const keys = {ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false};
// Analoger Joystick (Paddel-Griff): Achsen in [-1..1]. joyActive = Finger aktiv.
// joyX/joyY werden in der Dead-Zone auf 0 gesetzt, sonst weich von 0 bis ±1.
let joyActive = false, joyX = 0, joyY = 0;

let bananaCache = null, riegelCache = null;

/* ---------- Utility ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const irregPoly = (a, b) => {
  const pts = [];
  for (let i = 0; i < 15; i++) {
    const ang = i * 2 * Math.PI / 15;
    pts.push({
      x: a * (0.8 + Math.random() * 0.4) * Math.cos(ang),
      y: b * (0.7 + Math.random() * 0.6) * Math.sin(ang)
    });
  }
  return pts;
};

/* Schwierigkeit steigt sehr sanft und spät */
function computeDifficulty() {
  // Enough current to get going immediately; later stages remain gentle.
  if (score < 95) return 0.55;
  if (score < 100) return 0.55 + ((score - 95) / 5) * 0.65;
  if (score < 195) return 1.2;
  if (score < 200) return 1.2 + ((score - 195) / 5) * 0.75;
  if (score < 295) return 1.95;
  if (score < 300) return 1.95 + ((score - 295) / 5) * 0.75;
  return 2.7;
}

/* ---------- Strömungszonen ----------
   Entlang der y-Achse wechseln sich Abschnitte ab:
   - ruhig (flowMul ca. 0.4)
   - normal (flowMul ca. 1.0)
   - Stromschnelle (flowMul ca. 1.7) */

function flowMultiplier(y) {
  // Smooth spatial transitions: quieter pools alternate with short faster runs.
  const wave = Math.sin(y / 1050 + 0.3) * 0.62 + Math.sin(y / 385 + 1.3) * 0.38;
  return 1.0 + wave * 0.47;
}

function zoneType(y) {
  const m = flowMultiplier(y);
  if (m < 0.78) return 'calm';
  if (m > 1.22) return 'rapid';
  return 'normal';
}

const waterEdges = y => {
  const narrow = 1 - (difficulty - 1) * 0.15;
  let leftEdge = bankWidth / narrow +
    meanderAmp * 0.7 * Math.sin(y / meanderWave * 2 * Math.PI) +
    meanderAmp * 0.3 * Math.sin(y / meanderWave * 3.5 * Math.PI);
  let rightEdge = WIDTH - bankWidth / narrow +
    meanderAmp * 0.8 * Math.sin(y / meanderWave * 2.5 * Math.PI + meanderPhase) +
    meanderAmp * 0.2 * Math.sin(y / meanderWave * 4 * Math.PI + meanderPhase * 0.5);
  // Mindest-Flussbreite: Kajak + Puffer — das Boot kommt IMMER durch, auch wenn
  // Mäander + Level-Narrowing zufällig an derselben Stelle maximal eng werden.
  const MIN_RIVER = (player.w || 28) + 34;   // ~62 px bei 28-px-Kajak
  if (rightEdge - leftEdge < MIN_RIVER) {
    const center = (leftEdge + rightEdge) / 2;
    leftEdge = center - MIN_RIVER / 2;
    rightEdge = center + MIN_RIVER / 2;
  }
  return [leftEdge, rightEdge];
};

const purge = arr => {
  for (let i = arr.length - 1; i >= 0; i--) {
    const r = arr[i].y - camY;
    if (r < -PAD || r > HEIGHT + PAD) arr.splice(i, 1);
  }
};

function isPlayerInWater() {
  // Check the tapered hull at each river cross-section, with a small brush margin.
  const points = [
    { x: player.x - player.w / 2 + 2, y: player.y },
    { x: player.x + player.w / 2 - 2, y: player.y },
    { x: player.x - player.w * .23, y: player.y - player.h * .45 },
    { x: player.x + player.w * .23, y: player.y - player.h * .45 },
    { x: player.x - player.w * .23, y: player.y + player.h * .45 },
    { x: player.x + player.w * .23, y: player.y + player.h * .45 }
  ];
  for (let p of points) {
    const [L, R] = waterEdges(p.y);
    if (p.x <= L || p.x >= R) return false;
  }
  return true;
}

function obbOverlap(ax, ay, aw, ah, aRot, bx, by, bw, bh, bRot) {
  const corners = (cx, cy, w, h, r) => {
    const c = Math.cos(r), s = Math.sin(r);
    const hw = w / 2, hh = h / 2;
    return [
      { x: cx + (-hw) * c - (-hh) * s, y: cy + (-hw) * s + (-hh) * c },
      { x: cx + ( hw) * c - (-hh) * s, y: cy + ( hw) * s + (-hh) * c },
      { x: cx + ( hw) * c - ( hh) * s, y: cy + ( hw) * s + ( hh) * c },
      { x: cx + (-hw) * c - ( hh) * s, y: cy + (-hw) * s + ( hh) * c }
    ];
  };
  const A = corners(ax, ay, aw, ah, aRot);
  const B = corners(bx, by, bw, bh, bRot);
  const axes = [
    { x: Math.cos(aRot), y: Math.sin(aRot) },
    { x: -Math.sin(aRot), y: Math.cos(aRot) },
    { x: Math.cos(bRot), y: Math.sin(bRot) },
    { x: -Math.sin(bRot), y: Math.cos(bRot) }
  ];
  for (let ax1 of axes) {
    let minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity;
    for (let p of A) {
      const dot = p.x * ax1.x + p.y * ax1.y;
      if (dot < minA) minA = dot;
      if (dot > maxA) maxA = dot;
    }
    for (let p of B) {
      const dot = p.x * ax1.x + p.y * ax1.y;
      if (dot < minB) minB = dot;
      if (dot > maxB) maxB = dot;
    }
    if (maxA < minB || maxB < minA) return false;
  }
  return true;
}

const HULL_CONTACT_LIMIT = 22; // 0.37 s at 60 Hz: enough time to correct a brush.
function resetHullContact() {
  player.contactTicks = 0;
  player.contactLastTick = -1;
  player.contactKind = '';
}

function findHullContact() {
  const awayFrom = (x, y, kind) => {
    const dx = player.x - x, dy = player.y - y, length = Math.hypot(dx, dy);
    return {kind, nx: length > .01 ? dx / length : 1, ny: length > .01 ? dy / length : 0};
  };
  if (!isPlayerInWater()) {
    const [L, R] = waterEdges(player.y);
    return {kind: 'bank', nx: player.x < (L + R) / 2 ? 1 : -1, ny: 0};
  }
  for (let o of obstacles) {
    if (o.type === 'rock') {
      const dx = player.x - o.x;
      const dy = player.y - o.y;
      const nearX = Math.max(0, Math.abs(dx) - player.w * 0.4);
      const nearY = Math.max(0, Math.abs(dy) - player.h * 0.4);
      const radius = Math.max(1, o.rad - 2);
      if (nearX * nearX + nearY * nearY < radius * radius) {
        return awayFrom(o.x, o.y, 'rock');
      }
    } else if (o.type === 'log') {
      const logX = o.x + Math.sin(tick * 0.05 + o.phase) * 2;
      if (obbOverlap(
        logX, o.y, o.len, o.wd, o.rot,
        player.x, player.y, player.w - 4, player.h - 6, 0
      )) {
        return awayFrom(logX, o.y, 'log');
      }
    }
  }
  for (const boat of policeBoats) {
    if (Math.abs(player.x - boat.x) < (boat.w + player.w) / 2 - 2 &&
        Math.abs(player.y - boat.y) < (boat.h + player.h) / 2 - 3) {
      return awayFrom(boat.x, boat.y, 'police');
    }
  }
  return null;
}

function checkCollisions() {
  if (player.capsized || gameOver || player.invulnerable) {
    resetHullContact();
    return;
  }
  // All physical obstacles share one decision per simulation tick.
  if (player.contactLastTick === tick) return;
  player.contactLastTick = tick;
  const contact = findHullContact();
  if (!contact) {
    player.contactTicks = Math.max(0, player.contactTicks - 2);
    if (!player.contactTicks) player.contactKind = '';
    return;
  }
  if (!player.contactTicks) {
    player.vx += contact.nx * .8;
    player.vy += contact.ny * .65;
    splashes.push({x: player.x + contact.nx * 13, y: player.y + contact.ny * 25,
      vx: 0, vy: 0, life: 18, maxLife: 18, r: 3, kind: 'ring'});
  }
  player.contactKind = contact.kind;
  player.contactTicks++;
  if (player.contactTicks >= HULL_CONTACT_LIMIT) capsizeKayak();
}

function capsizeKayak() {
  resetHullContact();
  player.capsized = true;
  player.capsizeTime = tick;
  lives--;
  player.vx = 0;
  player.vy = 0;
  playSplash();
  // Grosse Spritzer-Wolke: schnelle Tropfen, mittlere Tropfen, Schaum und grosse Welle
  for (let i = 0; i < 40; i++) {
    const ang = rand(0, Math.PI * 2);
    const speed = rand(1, 6);
    splashes.push({
      x: player.x + rand(-10, 10),
      y: player.y + rand(-15, 15),
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed - rand(1, 3),
      life: 60,
      maxLife: 60,
      r: rand(1.5, 3.5),
      kind: 'drop'
    });
  }
  // Grössere Schaum-Klumpen
  for (let i = 0; i < 15; i++) {
    const ang = rand(0, Math.PI * 2);
    const speed = rand(0.5, 2.5);
    splashes.push({
      x: player.x + rand(-8, 8),
      y: player.y + rand(-8, 8),
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed * 0.5 - rand(0.5, 1.5),
      life: 80,
      maxLife: 80,
      r: rand(4, 8),
      kind: 'foam'
    });
  }
  // Zentraler Wellenring
  splashes.push({
    x: player.x,
    y: player.y,
    vx: 0, vy: 0,
    life: 50,
    maxLife: 50,
    r: 5,
    kind: 'ring'
  });
  splashes.push({
    x: player.x,
    y: player.y,
    vx: 0, vy: 0,
    life: 70,
    maxLife: 70,
    r: 3,
    kind: 'ring'
  });
  if (lives <= 0) {
    gameOver = true;
    // A broad campsite keeps the two seated adults, baby and fire clearly separated.
    const [collisionL, collisionR] = waterEdges(player.y);
    const preferredSide = player.x - collisionL < collisionR - player.x ? 'L' : 'R';
    const landingAt = (worldY, side) => {
      let width = WIDTH;
      for (let offset = -90; offset <= 90; offset += 3) {
        const [left, right] = waterEdges(worldY + offset);
        width = Math.min(width, side === 'L' ? left : WIDTH - right);
      }
      return {side, y: worldY, width};
    };
    let landing = null, landingScore = -Infinity;
    for (const side of [preferredSide, preferredSide === 'L' ? 'R' : 'L']) {
      for (let screenY = 250; screenY <= HEIGHT - 360; screenY += 6) {
        const candidate = landingAt(camY + screenY, side);
        const score = (candidate.width >= 105 ? 1000 : 0) +
          Math.min(candidate.width, 132) +
          (side === preferredSide && candidate.width >= 105 ? 12 : 0) -
          Math.abs(screenY - 365) * .07;
        if (score > landingScore) { landing = candidate; landingScore = score; }
      }
    }
    if (landing.width < 105) {
      // Very broad bends occasionally leave no usable bank in this view.
      // Settle once on the nearest wide landing, then freeze the camera there.
      let nearest = Infinity;
      for (const side of [preferredSide, preferredSide === 'L' ? 'R' : 'L']) {
        for (let dy = -1800; dy <= 1800; dy += 8) {
          const candidate = landingAt(player.y + dy, side);
          if (candidate.width < 105) continue;
          const travel = Math.abs(dy) + (side === preferredSide ? 0 : 28);
          if (travel < nearest) { landing = candidate; nearest = travel; }
        }
      }
      camY = landing.y - 365;
    }
    player.beachSide = landing.side;
    player.beachAnchorY = landing.y;
    const [landingL, landingR] = waterEdges(landing.y);
    player.beachAnchorX = landing.side === 'L' ? landingL - 5 : landingR + 5;
    // Launch the empty hull on the water side, away from the seated family.
    player.y = landing.y;
    const hullMargin = Math.min(48, (landingR - landingL) / 2);
    player.x = landing.side === 'L' ? landingL + hullMargin : landingR - hullMargin;
    player.capsized = false;  // wieder aufgerichtet am Strand
    // Paddel driftet als zweiter "Baumstamm" separat vom Kajak.
    const side = player.beachSide;
    player.paddleX = player.x + (side === 'L' ? 25 : -25);
    player.paddleY = player.y + 94;
    player.paddleRot = rand(0, Math.PI * 2);
    player.paddleRotSpeed = rand(0.015, 0.028) * (Math.random() < 0.5 ? -1 : 1);
    player.paddleDriftX = rand(-0.15, 0.15);
    player.gameOverRot = 0;
    player.gameOverRotSpeed = rand(0.008, 0.016) * (Math.random() < 0.5 ? -1 : 1);
    const baseAngle = side === 'L' ? -Math.PI / 2.4 : Math.PI / 2.4;
    const hull = fitFloatingBody(player.x, player.y, 18, player.h / 2 + 11, baseAngle);
    player.x = hull.x; player.gameOverRot = hull.angle - baseAngle;
    const paddle = fitFloatingBody(player.paddleX, player.paddleY, 42, 5, player.paddleRot);
    player.paddleX = paddle.x; player.paddleRot = paddle.angle;
    // Sirene sofort fade-outen, damit sie nicht durchs ganze GameOver heult.
    if (sirenActive && musicCtx) {
      const acT = musicCtx.currentTime;
      sirenActive.g.gain.cancelScheduledValues(acT);
      sirenActive.g.gain.linearRampToValueAtTime(0, acT + 0.4);
      const s = sirenActive;
      setTimeout(() => { try { s.osc.stop(); s.lfo.stop(); } catch (e) {} }, 500);
      sirenActive = null;
    }
    playGameOverSound();
  }
}

function setSize() {
  WIDTH = BASE_W;
  HEIGHT = BASE_H;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.round(WIDTH * dpr);
  cvs.height = Math.round(HEIGHT * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const scale = Math.min(window.innerWidth / BASE_W, window.innerHeight / BASE_H);
  cvs.style.width = `${BASE_W * scale}px`;
  cvs.style.height = `${BASE_H * scale}px`;
  bankWidth = WIDTH * 0.2;
  riverWidth = WIDTH - 2 * bankWidth;
  meanderAmp = riverWidth * 0.4;
  meanderWave = HEIGHT * 0.8;
}

function resetPlayer() {
  resetHullContact();
  player.x = WIDTH / 2;
  player.y = HEIGHT / 2 + 200;
  player.vx = 0; player.vy = 0;
  player.capsized = false; player.capsizeTime = 0;
  player.invulnerable = false; player.invulnerableTime = 0;
  player.paddlePhase = 0; player.paddleAmp = 0;
  lives = 3; score = 0; secretsRevealed = 0; gameOver = false;
  distance = 0;
  startY = player.y;
  difficulty = computeDifficulty();
  tick = 0;
  flowTraces.length = 0;
  camY = player.y - HEIGHT * 0.4;
  const [left, right] = waterEdges(player.y);
  player.x = (left + right) / 2;
  player.invulnerable = true;
  player.invulnerableTime = 0;
  clearControls();
  _loopLastTime = 0;
  _loopAcc = 0;
}

/* ---------- Encounter pacing ---------- */
// Keep new encounters inside the retained world strip. Previously most spawns
// started beyond -PAD and disappeared in the same update, before ever appearing.
const encounterNext = {};
let encounterClock = 0, encounterLastDistance = 0;
function encounterSpawnY() { return camY - rand(36, 126); }
function resetEncounterPacing() {
  encounterClock = 0; encounterLastDistance = 0;
  Object.assign(encounterNext, {rock:220, log:560, banana:160, riegel:230,
    fisherman:680, fish:430, police:1420});
}
function updateEncounterPacing() {
  // Faster paddling brings encounters sooner per stretch. Slow drifting still
  // has activity, and braking cannot create a burst of queued spawns.
  const travelled = Math.max(0, distance - encounterLastDistance);
  encounterLastDistance = Math.max(encounterLastDistance, distance);
  encounterClock += Math.max(.65, Math.min(1.6, travelled / 2.35));
  const due = (kind, interval, spawn, room) => {
    if (encounterClock < encounterNext[kind]) return;
    encounterNext[kind] = encounterClock + interval * rand(.88, 1.12);
    if (room) spawn();
  };
  // A gentle current must not also stretch the wait between encounters.
  const encounterTempo = Math.max(.85, difficulty);
  due('rock', Math.max(280, 430 / encounterTempo), spawnRock,
    obstacles.filter(o => o.type === 'rock').length < 5);
  due('log', Math.max(400, 500 / encounterTempo), spawnLog,
    obstacles.filter(o => o.type === 'log').length < 2);
  due('banana', difficulty < 1 ? 250 : 320, spawnBanana, collectibles.length < 7);
  due('riegel', difficulty < 1 ? 360 : 460, spawnRiegel, collectibles.length < 7);
  due('fisherman', 1500, spawnFisherman, fishermen.length < 2);
  due('fish', 1650, spawnFish, fishes.length < 1);
  // A patrol remains an event, with only one boat anywhere in the live strip.
  due('police', 1500, spawnPoliceBoat, policeBoats.length < 1);
}

function spawnRock(y = encounterSpawnY(), placement = null) {
  const [L, R] = waterEdges(y);
  const riverW = R - L;
  let x;
  if (placement) x = L + riverW * placement.across;
  else if (Math.random() < 0.8) x = L + rand(20, riverW - 40);
  else x = Math.random() < 0.5 ? L + rand(-20, 20) : R + rand(-20, 20);
  const rad = placement ? placement.rad : rand(15, 40);

  // Sicherstellen, dass der Fluss nie ganz blockiert ist: in ähnlicher Höhe
  // muss nach dem Platzieren mindestens eine kajakbreite Lücke übrig bleiben.
  const minGap = 80;
  const intervals = [[
    Math.max(L, x - rad),
    Math.min(R, x + rad)
  ]];
  for (const o of obstacles) {
    if (o.type !== 'rock') continue;
    if (Math.abs(o.y - y) > Math.max(rad, o.rad) + 25) continue;
    intervals.push([
      Math.max(L, o.x - o.rad),
      Math.min(R, o.x + o.rad)
    ]);
  }
  intervals.sort((a, b) => a[0] - b[0]);
  const merged = [[intervals[0][0], intervals[0][1]]];
  for (let i = 1; i < intervals.length; i++) {
    const top = merged[merged.length - 1];
    if (intervals[i][0] <= top[1] + 2) top[1] = Math.max(top[1], intervals[i][1]);
    else merged.push([intervals[i][0], intervals[i][1]]);
  }
  let maxGap = Math.max(0, merged[0][0] - L);
  for (let i = 1; i < merged.length; i++) {
    maxGap = Math.max(maxGap, merged[i][0] - merged[i - 1][1]);
  }
  maxGap = Math.max(maxGap, R - merged[merged.length - 1][1]);
  if (maxGap < minGap) return;

  // Varianz: Farbfamilie, Aspect-Ratio (abgeflacht oder aufrecht), Rotation, Moos-Menge.
  const paletteRoll = Math.random();
  let basePal;
  if (paletteRoll < 0.35) basePal = ['#4a4a4a', '#6a6a6a', '#8f8f8f', '#b0b0b0'];        // dunkelgrau
  else if (paletteRoll < 0.7) basePal = ['#5a5a5a', '#7a7a7a', '#a0a0a0', '#c0c0c0'];   // mittelgrau (alt)
  else if (paletteRoll < 0.88) basePal = ['#6a5c48', '#8a785f', '#ad9b7e', '#c9b999']; // bräunlich (Sandstein)
  else basePal = ['#4a5a5e', '#6c7e82', '#8fa4a8', '#b4c6ca'];                           // bläulich (Granit)

  const aspect = rand(0.7, 1.4);
  const radX = rad * aspect;
  const radY = rad / Math.sqrt(aspect);
  const rockRot = rand(0, Math.PI * 2);
  const mossAmount = Math.random() < 0.25 ? 0 : rand(0.55, 0.75);
  const mossAng = rand(0, Math.PI * 2);
  const mossOffset = { x: Math.cos(mossAng) * rad * 0.3, y: Math.sin(mossAng) * rad * 0.3 };

  obstacles.push({
    type: 'rock', x, y, rad,
    radX, radY, rockRot,
    mossOffset, mossAmount,
    layers: [
      { pts: irregPoly(radX, radY), col: basePal[0] },
      { pts: irregPoly(radX * 0.95, radY * 0.95), col: basePal[1] },
      { pts: irregPoly(radX * 0.7, radY * 0.7), col: basePal[2] },
      { pts: irregPoly(radX * 0.35, radY * 0.35), col: basePal[3] }
    ]
  });
}

function spawnLog(y = encounterSpawnY()) {
  const [L, R] = waterEdges(y);
  const riverW = R - L;
  // Leave room to pass a rotating trunk and avoid hazard clusters.
  if (riverW < 150 || obstacles.some(o => Math.abs(o.y - y) < 150)) return;
  const x = L + rand(40, riverW - 80);
  const len = rand(60, 110), wd = rand(18, 30);
  const branches = [];
  for (let i = 0; i < 3; i++) branches.push({ ang: rand(0, Math.PI * 2), len: rand(15, 30) });
  obstacles.push({
    type: 'log', x, y, vx: 0, vy: BASE_FLOW,
    pts: irregPoly(len / 2, wd / 2),
    branches, phase: rand(0, Math.PI * 2),
    rot: rand(0, Math.PI * 2), rotSpeed: rand(-0.01, 0.01),
    len: len, wd: wd
  });
}

function spawnTree() {
  const baseY = player.y - HEIGHT / 2 - rand(0, HEIGHT * 2);
  const treeCount = Math.floor(rand(2, 4));
  for (let i = 0; i < treeCount; i++) {
    const side = Math.random() < 0.5 ? 'L' : 'R';
    const y = baseY + rand(-100, 100);
    trees.push({
      side, off: rand(5, 30), y,
      w: rand(20, 60), h: rand(40, 150),
      trunkHeight: rand(10, 30),
      type: Math.random() < 0.6 ? 'conifer' : 'oval',
      shade: rand(0.85, 1.15)
    });
  }
}

function spawnBanana(y = encounterSpawnY()) {
  const [L, R] = waterEdges(y);
  const x = L + rand(30, R - L - 60);
  collectibles.push({
    type: 'banana', x, y, w: 30, h: 20, collected: false,
    bob: rand(0, Math.PI * 2),
    rot: rand(-0.2, 0.2),
    rotSpeed: rand(-0.008, 0.008)
  });
}

function spawnRiegel(y = encounterSpawnY()) {
  const [L, R] = waterEdges(y);
  const x = L + rand(30, R - L - 60);
  collectibles.push({
    type: 'riegel', x, y, w: 60, h: 30, collected: false,
    bob: rand(0, Math.PI * 2),
    rot: rand(-0.2, 0.2),
    rotSpeed: rand(-0.006, 0.006)
  });
}

function spawnFish() {
  const y = player.y - rand(100, 300);
  const [L, R] = waterEdges(y);
  const riverW = R - L;
  const x = L + rand(50, riverW - 100);
  fishes.push({ x, y, w: 60, h: 35, speed: 0.5, collected: false });
}

function spawnFisherman(y = encounterSpawnY()) {
  const [left, right] = waterEdges(y);
  const canLeft = left >= 35, canRight = right <= WIDTH - 35;
  if (!canLeft && !canRight) return;
  const side = canLeft && (!canRight || Math.random() < .5) ? 'L' : 'R';
  // Rute zufällig entweder ins Wasser gehalten (angelnd) oder hochgestellt
  // am Ufer — nur wenn die Rute im Wasser ist, gibt's Punktabzug.
  fishermen.push({
    side, y,
    flashTime: 0, touched: false,
    rodInWater: Math.random() < 0.55
  });
}

function spawnPoliceBoat() {
  const y = camY + HEIGHT - 100;
  const [L, R] = waterEdges(y);
  const riverW = R - L;
  const x = L + rand(40, riverW - 80);
  policeBoats.push({
    x, y,
    w: 72, h: 24,
    vy: BASE_FLOW * 6,   // Dreimal so schnell wie vorher (war * 2)
    blinkPhase: 0
  });
}

function checkFishCollection() {
  fishes.forEach(fish => {
    if (!fish.collected && !player.capsized) {
      const dx = Math.abs(player.x - fish.x);
      const dy = Math.abs(player.y - fish.y);
      if (dx < (fish.w + player.w) / 2 && dy < (fish.h + player.h) / 2) {
        fish.collected = true;
        if (lives < 3) lives++;
        scorePops.push({ x: fish.x, y: fish.y, t: tick, pts: 'Leben' });
        playNamNam();
      }
    }
  });
  for (let i = fishes.length - 1; i >= 0; i--) {
    if (fishes[i].collected || fishes[i].y - camY < -PAD || fishes[i].y - camY > HEIGHT + PAD) {
      fishes.splice(i, 1);
    }
  }
}

function checkFishermanCollision() {
  if (player.capsized || gameOver || player.invulnerable) return;
  fishermen.forEach(fisherman => {
    if (!fisherman.rodInWater) return;  // Ohne Rute im Wasser kein Abzug
    if (fisherman.hitCooldown && tick - fisherman.hitCooldown < 90) return;
    const [L, R] = waterEdges(fisherman.y);
    // Gleiche Platzierungsregel wie in drawFisherman: immer ausserhalb des Wassers.
    const edgeGap = 15;
    let adjustedX;
    if (fisherman.side === 'L') {
      adjustedX = Math.max(20, L - 40);
      if (adjustedX > L - edgeGap) return;   // Fischer ist unsichtbar → keine Kollision
    } else {
      adjustedX = Math.min(WIDTH - 20, R + 40);
      if (adjustedX < R + edgeGap) return;
    }
    const scale = 0.4;
    const bobberX = fisherman.side === 'L'
      ? adjustedX + 410 * scale
      : adjustedX - 410 * scale;
    const bobberY = fisherman.y + 240 * scale;

    const bobberDx = Math.abs(player.x - bobberX);
    const bobberDy = Math.abs(player.y - bobberY);
    const fisherDx = Math.abs(player.x - adjustedX);
    const fisherDy = Math.abs(player.y - fisherman.y);
    const lineMinX = Math.min(adjustedX, bobberX);
    const lineMaxX = Math.max(adjustedX, bobberX);
    const linesOverlap = !(player.x + player.w / 2 < lineMinX || player.x - player.w / 2 > lineMaxX);
    const isNearLineY = Math.abs(player.y - fisherman.y) < 150;

    if ((bobberDx < 40 && bobberDy < 40) ||
        (fisherDx < 50 && fisherDy < 80) ||
        (linesOverlap && isNearLineY)) {
      const penalty = 10;
      score = Math.max(0, score - penalty);
      scorePops.push({ x: player.x, y: player.y - 10, t: tick, pts: `-${penalty}` });
      fisherman.hitCooldown = tick;
      fisherman.flashTime = tick;
      fisherman.touched = true;
      playCurse();
    }
  });
}

function checkPoliceBoatCollision() {
  // Retain the interaction hook while sharing the same contact budget.
  checkCollisions();
}

function checkCollection() {
  collectibles.forEach(item => {
    // Float with the same curved current and return eddies as the kayak.
    const localFlow = sampleCurrent(item.x, item.y);
    item.x += localFlow.x;
    item.y += localFlow.y;
    item.rot += item.rotSpeed;
    // Am Uferrand zurückstossen
    const [L, R] = waterEdges(item.y);
    if (item.x < L + 20) item.x = L + 20;
    if (item.x > R - 20) item.x = R - 20;

    if (!item.collected && !player.capsized) {
      const dx = Math.abs(player.x - item.x);
      const dy = Math.abs(player.y - item.y);
      if (dx < (item.w + player.w) / 2 && dy < (item.h + player.h) / 2) {
        item.collected = true;
        const pts = item.type === 'banana' ? 10 : 25;
        score += pts;
        scorePops.push({ x: item.x, y: item.y, t: tick, pts });
        playNamNam();
      }
    }
  });
  for (let i = collectibles.length - 1; i >= 0; i--) {
    if (collectibles[i].collected || collectibles[i].y - camY < -PAD || collectibles[i].y - camY > HEIGHT + PAD) {
      collectibles.splice(i, 1);
    }
  }
  for (let i = scorePops.length - 1; i >= 0; i--) {
    if (tick - scorePops[i].t > 60) scorePops.splice(i, 1);
  }
  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i];
    if (s.kind === 'ring') {
      s.r += 1.2;
      s.life--;
    } else {
      s.x += s.vx;
      s.y += s.vy;
      s.vy += s.kind === 'foam' ? 0.08 : 0.18;
      s.vx *= 0.98;
      s.life--;
    }
    if (s.life <= 0) splashes.splice(i, 1);
  }
}

function populate() {
  resetEncounterPacing();
  // The first goal and small off-centre rock are visible below the HUD.
  // Alternate the next bends, with a broad passing lane and room to react.
  spawnRock(player.y - 160, {across: .24, rad: 23});
  spawnRock(player.y - 388, {across: .74, rad: 26});
  spawnLog(player.y - 570);
  const provision = (spawn, ahead, across) => {
    const y = player.y - ahead;
    spawn(y);
    const item = collectibles[collectibles.length - 1];
    const [L, R] = waterEdges(y), margin = item.w / 2 + 12;
    item.x = Math.max(L + margin, Math.min(R - margin, L + (R - L) * across));
  };
  provision(spawnBanana, 70, .5);
  provision(spawnRiegel, 145, .72);
  provision(spawnRiegel, 285, .48);
  provision(spawnBanana, 452, .3);
  spawnFisherman(player.y - 240);
  if (fishermen.length) fishermen[fishermen.length - 1].rodInWater = false;
  for (let i = 0; i < 10; i++) spawnTree();
}

/* ---------- Offscreen-Caches ---------- */
function buildBananaCache() {
  // Three pixels per logical pixel keep small collectibles crisp on Retina.
  const c = document.createElement('canvas');
  c.width = 120; c.height = 96;
  const g = c.getContext('2d');
  g.scale(3, 3); g.translate(20, 16);
  const body = () => {
    g.beginPath(); g.moveTo(-14, -8);
    g.bezierCurveTo(-17, 4, -8, 12, 5, 7);
    g.bezierCurveTo(12, 4, 15, -1, 16, -7);
    g.bezierCurveTo(7, 1, -7, 1, -12, -9);
    g.closePath();
  };
  const peel = g.createLinearGradient(-5, -9, 5, 9);
  peel.addColorStop(0, '#fff0a0'); peel.addColorStop(.45, '#e8c448'); peel.addColorStop(1, '#bc8839');
  g.fillStyle = peel; g.strokeStyle = '#937135'; g.lineWidth = .8;
  body(); g.fill(); g.stroke();
  g.save(); body(); g.clip();
  g.strokeStyle = 'rgba(255,248,186,.82)'; g.lineWidth = 1.3;
  g.beginPath(); g.moveTo(-12, -5); g.bezierCurveTo(-10, 8, 8, 8, 14, -5); g.stroke();
  g.strokeStyle = 'rgba(151,111,43,.50)'; g.lineWidth = .6;
  g.beginPath(); g.moveTo(-12, -3); g.bezierCurveTo(-8, 10, 9, 6, 14, -5); g.stroke();
  for (let i = 0; i < 5; i++) {
    g.fillStyle = 'rgba(140,102,47,.32)';
    g.beginPath(); g.ellipse(-7 + i * 3, 5 + Math.sin(i * 1.7), .45, .3, i, 0, Math.PI * 2); g.fill();
  }
  g.restore();
  g.strokeStyle = '#6b6441'; g.lineCap = 'round'; g.lineWidth = 2.7;
  g.beginPath(); g.moveTo(-13, -8); g.lineTo(-12, -11); g.stroke();
  g.strokeStyle = '#b1ab69'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(-13, -9); g.lineTo(-12.5, -11); g.stroke();
  g.fillStyle = '#6e5535'; g.beginPath(); g.ellipse(15, -6.4, 1.2, .7, -1, 0, Math.PI * 2); g.fill();
  return c;
}

function buildRiegelCache() {
  const c = document.createElement('canvas');
  c.width = 198; c.height = 108;
  const g = c.getContext('2d');
  g.scale(3, 3); g.translate(33, 18);
  const wrapper = () => {
    g.beginPath();g.moveTo(-30,-12);
    for(let i=0;i<7;i++)g.lineTo(-30-(i%2),-12+i*4);
    g.lineTo(30,12);
    for(let i=0;i<7;i++)g.lineTo(30+(i%2),12-i*4);
    g.closePath();
  };
  const paper=g.createLinearGradient(0,-12,0,12);
  paper.addColorStop(0,'#ae4fac');paper.addColorStop(.35,'#843686');paper.addColorStop(1,'#552559');
  g.fillStyle=paper;g.strokeStyle='#43234b';g.lineWidth=.8;wrapper();g.fill();g.stroke();
  g.save();wrapper();g.clip();
  g.fillStyle='rgba(255,230,245,.3)';g.fillRect(-31,-10,62,2);
  g.fillStyle='rgba(37,14,45,.23)';g.fillRect(-31,9,62,3);
  g.strokeStyle='rgba(237,183,220,.65)';g.lineWidth=.6;
  for(const x of [-28,-26,26,28]){g.beginPath();g.moveTo(x,-10);g.lineTo(x,10);g.stroke();}
  g.restore();
  // Lettering stays large at the final on-screen size, independent of Retina.
  g.fillStyle='#fff9e8';g.font='900 12px Arial, sans-serif';
  g.textAlign='center';g.textBaseline='middle';g.fillText('FARMER',0,-1);
  g.strokeStyle='#d9bd83';g.lineWidth=.7;
  g.beginPath();g.moveTo(-8,8);g.lineTo(8,8);g.stroke();
  for(let i=0;i<5;i++){
    g.fillStyle=i%2?'#efd29d':'#c6a86f';g.beginPath();g.ellipse(-6+i*3,7,1.7,.65,i%2?.6:-.6,0,Math.PI*2);g.fill();
  }
  return c;
}

function init() {
  setSize();
  resetPlayer();
  obstacles.length = trees.length = collectibles.length = scorePops.length = splashes.length = 0;
  fishermen.length = fishes.length = policeBoats.length = 0;
  paused = !hasStarted;
  if (!bananaCache) bananaCache = buildBananaCache();
  if (!riegelCache) riegelCache = buildRiegelCache();
  populate();
  if (!loopStarted) { loopStarted = true; requestAnimationFrame(loop); }
}

window.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();
window.addEventListener('resize', setSize);
window.addEventListener('click', e => {
  if (e.target !== cvs) return;
  // Klick auf Ton-Button (oben links)?
  const rect = cvs.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * (WIDTH / rect.width);
  const cy = (e.clientY - rect.top) * (HEIGHT / rect.height);
  const btnX = 8, btnY = 52, btnW = 44, btnH = 36;
  if (cx >= btnX && cx <= btnX + btnW && cy >= btnY && cy <= btnY + btnH) {
    startMusic();
    toggleMute();
    e.preventDefault();
    return;
  }
  // Klick auf Pause-Button (oben rechts)?
  const pbX = 8, pbY = 8, pbW = 44, pbH = 36;
  if (cx >= pbX && cx <= pbX + pbW && cy >= pbY && cy <= pbY + pbH) {
    togglePause();
    e.preventDefault();
    return;
  }
  if (gameOver && e.target === cvs) { e.preventDefault(); init(); }
});

window.addEventListener('keydown', e => {
  if (e.key in keys) { e.preventDefault(); keys[e.key] = true; }
});
window.addEventListener('keyup', e => {
  if (e.key in keys) { e.preventDefault(); keys[e.key] = false; }
});

/* ---------- Flussklänge: ein AudioContext, weich gemischte Klangspuren ---------- */
let musicCtx = null, musicStarted = false;
let masterGain = null, musicBus = null, sfxBus = null;
let noiseGainNode = null, noiseLPNode = null, foamGainNode = null;
let soundMuted = true, audioPending = false, audioError = '';
let audioTimer = null, audioHideTimer = null, audioNoiseBuffer = null;
let nextMusicTime = 0, musicStep = 0, lastAudioMix = -Infinity, lastPaddleBeat = 0;
let sirenActive = null;
const audioTargets = new WeakMap();
// Traditionelle Drunken-Sailor-Melodie aus der ursprünglichen Spielversion.
// Acht Takte bei 100 BPM; der Scheduler plant jeweils nur die nächste Achtelnote.
const SAILOR_BEAT = 60 / 100, SAILOR_STEPS = 64;
const SAILOR_NOTES = {D2:73.4, C3:130.8, D3:146.8, E3:164.8, F3:175, G3:196, A3:220,
  C4:261.6, D4:293.7, E4:329.6, F4:349.2, G4:392, A4:440, B4:493.9, C5:523.3, D5:587.3};
const SAILOR_MELODY = [
  ['A4',0,.5], ['A4',.5,.5], ['A4',1,.5], ['A4',1.5,.5],
  ['A4',2,.5], ['A4',2.5,.5], ['D4',3,.5], ['F4',3.5,.5], ['A4',4,4],
  ['G4',8,.5], ['G4',8.5,.5], ['G4',9,.5], ['G4',9.5,.5],
  ['G4',10,.5], ['G4',10.5,.5], ['C4',11,.5], ['E4',11.5,.5], ['G4',12,4],
  ['A4',16,.5], ['A4',16.5,.5], ['A4',17,.5], ['A4',17.5,.5],
  ['A4',18,.5], ['B4',18.5,.5], ['C5',19,.5], ['D5',19.5,2.5],
  ['A4',24,1], ['G4',25,1], ['F4',26,1], ['E4',27,1], ['D4',28,2], ['D4',30,2]
].map(([note, beat, length]) => [SAILOR_NOTES[note], beat, length]);
const SAILOR_BASS = ['D2','D2','C3','C3','D2','D2','C3','D2'].map(note => SAILOR_NOTES[note]);
const SAILOR_CHORDS = ['Dm','Dm','C','C','Dm','Dm','C','Dm'].map(chord =>

const sailorMelodySteps = new Map(SAILOR_MELODY.map(([frequency, beat, length]) => [beat * 2, {frequency, length}]));

function audioRamp(param, target, seconds = 0.18) {
  if (!musicCtx || !param) return;
  if (audioTargets.get(param) === target) return;
  audioTargets.set(param, target);
  const t = musicCtx.currentTime;
  if (param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t);
  else { const value = param.value; param.cancelScheduledValues(t); param.setValueAtTime(value, t); }
  param.linearRampToValueAtTime(target, t + seconds);
}

function smoothWaterParam(param, target, seconds) {
  if (audioTargets.get(param) === target) return;
  audioTargets.set(param, target);
  // Der Audiothread glättet auch zwischen unregelmässigen Spiel-Frames weiter.
  param.setTargetAtTime(target, musicCtx.currentTime, seconds);
}

function createRiverNoise(ac, duration, pole = 0, gain = 0.7) {
  const count = Math.round(ac.sampleRate * duration);
  const buffer = ac.createBuffer(2, count, ac.sampleRate);
  for (let channel = 0; channel < 2; channel++) {
    const data = buffer.getChannelData(channel);
    let low = 0;
    for (let i = 0; i < count; i++) {
      data[i] = Math.random() * 2 - 1;
      low = pole * low + (1 - pole) * data[i];
    }
    // Periodischer Filterzustand: der Übergang verhält sich wie jeder andere
    // Sample-Schritt, ohne die Lautstärkesenke einer kurzen Überblendung.
    low /= 1 - Math.pow(pole, count);
    for (let i = 0; i < count; i++) {
      low = pole * low + (1 - pole) * data[i];
      data[i] = low * gain;
    }
  }
  return buffer;
}

function getAudioStatus() {
  return { enabled: !soundMuted, audible: !soundMuted && musicCtx?.state === 'running' && !document.hidden,
    context: musicCtx?.state || 'not-created', pending: audioPending, error: audioError,
    mix: !hasStarted ? 'preview' : paused ? 'paused' : gameOver ? 'shore' : 'river' };
}

function syncSoundUI() {
  const btn = document.getElementById('sound-start-btn');

  const ready = !soundMuted && musicCtx?.state === 'running';
  btn.setAttribute('aria-pressed', String(ready));
  btn.setAttribute('aria-busy', String(audioPending));

}

function audioCanPlay() { return !soundMuted && musicCtx?.state === 'running' && !document.hidden; }

function audioTone(frequency, when, duration, gain = 0.13, bus = sfxBus, type = 'sine', endFrequency = frequency, sustain = false) {
  if (!audioCanPlay() || !bus) return;
  const ac = musicCtx, osc = ac.createOscillator(), envelope = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(frequency, when);
  if (endFrequency !== frequency) osc.frequency.exponentialRampToValueAtTime(endFrequency, when + duration);
  envelope.gain.setValueAtTime(0, when);
  envelope.gain.linearRampToValueAtTime(gain, when + Math.min(0.024, duration * 0.18));
  if (sustain) envelope.gain.linearRampToValueAtTime(gain * 0.72, when + duration * 0.55);
  envelope.gain.exponentialRampToValueAtTime(0.0001, when + duration);
  osc.connect(envelope); envelope.connect(bus);
  osc.onended = () => { osc.disconnect(); envelope.disconnect(); };
  osc.start(when); osc.stop(when + duration + 0.025);
}

function audioWaterHit(when, duration, gain, frequency, pan = 0, attack = 0.018) {
  if (!audioCanPlay() || !audioNoiseBuffer) return;
  const ac = musicCtx, source = ac.createBufferSource(), filter = ac.createBiquadFilter(), envelope = ac.createGain();
  source.buffer = audioNoiseBuffer;
  filter.type = 'lowpass'; filter.Q.value = 0.7;
  filter.frequency.setValueAtTime(frequency, when);
  filter.frequency.exponentialRampToValueAtTime(Math.max(180, frequency * 0.2), when + duration);
  envelope.gain.setValueAtTime(0, when);
  envelope.gain.linearRampToValueAtTime(gain, when + attack);
  envelope.gain.exponentialRampToValueAtTime(0.0001, when + duration);
  source.connect(filter); filter.connect(envelope);
  let panner = null;
  if (ac.createStereoPanner) { panner = ac.createStereoPanner(); panner.pan.value = pan; envelope.connect(panner); panner.connect(sfxBus); }
  else envelope.connect(sfxBus);
  source.onended = () => { source.disconnect(); filter.disconnect(); envelope.disconnect(); panner?.disconnect(); };
  source.start(when, (when * 0.37) % Math.max(0.1, audioNoiseBuffer.duration - duration));
  source.stop(when + duration + 0.03);
}

function buildAudioGraph() {
  const AudioCtor = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtor) throw new Error('Audio wird von diesem Browser nicht unterstützt.');
  const ac = musicCtx = new AudioCtor();
  masterGain = ac.createGain(); masterGain.gain.value = 0;
  const limiter = ac.createDynamicsCompressor();
  limiter.threshold.value = -16; limiter.knee.value = 14; limiter.ratio.value = 5;
  limiter.attack.value = 0.006; limiter.release.value = 0.22;
  masterGain.connect(limiter); limiter.connect(ac.destination);
  musicBus = ac.createGain(); musicBus.gain.value = 0.28; musicBus.connect(masterGain);
  sfxBus = ac.createGain(); sfxBus.gain.value = 0.65; sfxBus.connect(masterGain);
  // Unabhängige Stereoquellen mit unterschiedlichen Loop-Längen laufen
  // durchgehend im Audiothread; Paddelschläge haben ihre eigene Rauschquelle.
  const waterBuffer = createRiverNoise(ac, 11.3, 0.97, 3.2);
  const foamBuffer = createRiverNoise(ac, 13.7);
  audioNoiseBuffer = createRiverNoise(ac, 2.3);
  const waterSource = ac.createBufferSource(); waterSource.buffer = waterBuffer; waterSource.loop = true;
  const waterHP = ac.createBiquadFilter(); waterHP.type = 'highpass'; waterHP.frequency.value = 95;
  noiseLPNode = ac.createBiquadFilter(); noiseLPNode.type = 'lowpass'; noiseLPNode.frequency.value = 1100;
  noiseGainNode = ac.createGain(); noiseGainNode.gain.value = 0.18;
  waterSource.connect(waterHP); waterHP.connect(noiseLPNode); noiseLPNode.connect(noiseGainNode); noiseGainNode.connect(masterGain);
  waterSource.start();
  const foamSource = ac.createBufferSource(); foamSource.buffer = foamBuffer; foamSource.loop = true;
  const foamFilter = ac.createBiquadFilter(); foamFilter.type = 'bandpass'; foamFilter.frequency.value = 2100; foamFilter.Q.value = 0.45;
  foamGainNode = ac.createGain(); foamGainNode.gain.value = 0.008;
  foamSource.connect(foamFilter); foamFilter.connect(foamGainNode); foamGainNode.connect(masterGain); foamSource.start();
  ac.addEventListener('statechange', () => {
    if (ac.state === 'running') { audioPending = false; nextMusicTime = ac.currentTime + 0.07; refreshAudioMix(true); }
    syncSoundUI();
  });
  musicStarted = true;
  nextMusicTime = ac.currentTime + 0.08;
  // Nur ein Scheduler. Kurzer Vorlauf erzeugt nach Pause/Tab-Wechsel keine Klanglawine.
  audioTimer = setInterval(audioScheduler, 100);
}

async function startMusic() {
  if (soundMuted) return false;
  try {
    if (!musicStarted) buildAudioGraph();
    if (musicCtx.state !== 'running') {
      audioPending = true; syncSoundUI();
      await musicCtx.resume();
    }
    audioPending = false; audioError = '';
    refreshAudioMix(true); syncSoundUI();
    return musicCtx.state === 'running';
  } catch (error) {
    soundMuted = true; audioPending = false;
    audioError = 'Sound konnte nicht starten. Bitte noch einmal antippen.';
    if (masterGain) audioRamp(masterGain.gain, 0, 0.08);
    syncSoundUI(); return false;
  }
}

function refreshAudioMix(force = false) {
  if (!musicCtx || !masterGain) return;
  const t = musicCtx.currentTime;
  if (!force && t - lastAudioMix < 0.07) return;
  lastAudioMix = t;
  audioRamp(masterGain.gain, soundMuted || document.hidden ? 0 : 0.85, 0.14);
  const resting = hasStarted && paused;
  audioRamp(musicBus.gain, resting ? 0 : gameOver ? 0.13 : 0.28, 0.24);
  let intensity = 0.4, eddy = 0, rapid = 0;
  if (hasStarted) {
    const flow = typeof sampleCurrent === 'function' ? sampleCurrent(player.x, player.y) : null;
    intensity = Math.min(1, Math.max(0, flow ? flow.speed / 2.2 : flowMultiplier(player.y) * difficulty / 3));
    eddy = flow ? Math.min(1, Math.max(0, Number(flow.eddy) || 0)) : Number(isInEddy(player.x, player.y));
    rapid = flow ? Math.min(1, Math.max(0, Number(flow.rapid) || 0)) : Math.max(0, intensity - 0.45);
  }
  const calm = resting ? 0.24 : gameOver ? 0.4 : 1;
  smoothWaterParam(noiseGainNode.gain, (0.16 + intensity * 0.25) * (1 - eddy * 0.48) * calm, 0.45);
  smoothWaterParam(noiseLPNode.frequency, 800 + intensity * 2100 + rapid * 1000 - eddy * 450, 0.55);
  smoothWaterParam(foamGainNode.gain, (0.006 + rapid * 0.062 + intensity * 0.016) * (1 - eddy * 0.72) * calm, 0.6);
}

function audioScheduler() {
  if (!musicCtx) return;
  refreshAudioMix();
  if (!audioCanPlay() || (hasStarted && paused)) { nextMusicTime = musicCtx.currentTime + 0.08; stopPoliceSiren(); return; }
  updatePoliceSiren();
  const now = musicCtx.currentTime;
  if (nextMusicTime < now - 0.15) nextMusicTime = now + 0.06;
  // Kein ganzer Song im Voraus: auch nach einem langen Tab-Wechsel höchstens
  // zwei Achtelschritte, ohne nachzuholende Noten oder zusätzliche Timer.
  for (let scheduled = 0; nextMusicTime < now + 0.2 && scheduled < 2; scheduled++) {
    const step = musicStep % SAILOR_STEPS, bar = Math.floor(step / 8), note = sailorMelodySteps.get(step);
    if (note) audioTone(note.frequency, nextMusicTime, note.length * SAILOR_BEAT * 0.92,
      0.22, musicBus, 'triangle', note.frequency, true);
    if (step % 4 === 0) {
      const bass = SAILOR_BASS[bar];
      audioTone(bass, nextMusicTime, 2 * SAILOR_BEAT * 0.92, 0.065, musicBus, 'triangle', bass, true);
      audioTone(125, nextMusicTime, 0.14, 0.075, musicBus, 'sine', 48);
    }
    if (step % 8 === 0) SAILOR_CHORDS[bar].forEach(f =>
      audioTone(f, nextMusicTime, 4 * SAILOR_BEAT * 0.95, 0.028, musicBus, 'triangle', f, true));
    nextMusicTime += SAILOR_BEAT / 2;
    musicStep = (musicStep + 1) % SAILOR_STEPS;
  }
}

function stopPoliceSiren() {

// On-Screen Joystick: Paddel als Griff. Finger-Position im Kreisfeld liefert
// analoge Achsen (joyX/joyY in [-1..1]); Dead-Zone ist weich rausgerechnet,
// d.h. am Rand der Dead-Zone startet der Wert sanft bei 0 und steigt zum
// Rand auf ±1. Das Paddel wandert dem Finger nach und rotiert so, dass der
// Schaft in Zugrichtung zeigt — Loslassen schnappt zurück ins Zentrum.
(function bindJoystick() {
  const joy = document.querySelector('.joystick');
  if (!joy) return;
  const svg = joy.querySelector('svg');
  const paddle = joy.querySelector('.paddle');
  if (!svg || !paddle) return;
  const MAX_R = 70;    // SVG-Einheiten, max. Auslenkung
  const DEAD_R = 14;   // SVG-Einheiten, Dead-Zone; kleiner als vorher, weil analog
  let activeId = null;

  const reset = () => {
    activeId = null;
    joy.classList.remove('dragging');
    paddle.setAttribute('transform', 'translate(90 90)');
    joyActive = false;
    joyX = 0;
    joyY = 0;
  };

  const update = (clientX, clientY) => {
    const rect = svg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;
    const sx = 180 / rect.width;
    const sy = 180 / rect.height;
    let dx = (clientX - cx) * sx;
    let dy = (clientY - cy) * sy;
    const r = Math.hypot(dx, dy);
    if (r > MAX_R) { dx *= MAX_R / r; dy *= MAX_R / r; }
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    paddle.setAttribute(
      'transform',
      `translate(${(90 + dx).toFixed(2)} ${(90 + dy).toFixed(2)}) rotate(${ang.toFixed(1)})`
    );
    const m = Math.hypot(dx, dy);
    if (m < DEAD_R) {
      joyX = 0; joyY = 0;
    } else {
      // Remap [DEAD_R..MAX_R] → [0..1] entlang der aktuellen Richtung.
      const scale = (m - DEAD_R) / (MAX_R - DEAD_R);
      joyX = (dx / m) * scale;
      joyY = (dy / m) * scale;
    }
  };

  joy.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { joy.setPointerCapture(e.pointerId); } catch (_) {}
    activeId = e.pointerId;
    joy.classList.add('dragging');
    joyActive = true;
    update(e.clientX, e.clientY);
    startMusic();
  });
  joy.addEventListener('pointermove', e => {
    if (e.pointerId !== activeId) return;
    e.preventDefault();
    update(e.clientX, e.clientY);
  });
  const up = e => {
    if (e.pointerId !== activeId) return;
    e.preventDefault();
    reset();
  };
  joy.addEventListener('pointerup', up);
  joy.addEventListener('pointercancel', up);
  joy.addEventListener('contextmenu', e => e.preventDefault());
})();


/* Shared, continuous current field. World downstream is negative y.
   The same field drives the kayak, floating objects, water trails and sound. */
function currentChannel(x, y) {
  const [left, right] = waterEdges(y);
  const width = Math.max(1, right - left);
  const across = Math.max(0, Math.min(1, (x - left) / width));
  const [upL, upR] = waterEdges(y + 10);
  const [dnL, dnR] = waterEdges(y - 10);
  // Follow this cross-channel streamline; the banks remain tangent to the flow.
  const slope = ((upL + across * (upR - upL)) - (dnL + across * (dnR - dnL))) / 20;
  const norm = Math.hypot(slope, 1);
  // A 128-pixel centreline span smooths curvature without alternating arbitrary
  // speed bands. Downstream is -y: positive x curvature bends RIGHT, placing
  // the outer bank LEFT. Therefore positive bend means the outer bank is RIGHT.
  const h = 64;
  const [farUpL, farUpR] = waterEdges(y + h);
  const [farDnL, farDnR] = waterEdges(y - h);
  const centre = (left + right) * .5;
  const centreUp = (farUpL + farUpR) * .5, centreDn = (farDnL + farDnR) * .5;
  const centreSlope = (centreUp - centreDn) / (2 * h);
  const curvature = (centreUp - 2 * centre + centreDn) / (h * h) /
    Math.pow(1 + centreSlope * centreSlope, 1.5);
  const bend = Math.tanh(-curvature * width * 1.75);
  const bankBias = bend * (across * 2 - 1);
  return {left, right, width, across, tx: -slope / norm, ty: -1 / norm,
    curvature, bend, bankBias, fastAcross: .5 + .25 * bend / (1 + .3 * Math.abs(bend))};
}

function getEddyGeometry(o) {
  const channel = currentChannel(o.x, o.y);
  const tx = channel.tx, ty = channel.ty;
  const nx = -ty, ny = tx;
  const rx = Math.min(Math.max(o.rad * 1.72, (o.radX || o.rad) * 1.42), channel.width * .38);
  const ry = Math.max(40, o.rad * 3.0);
  const offset = (o.radY || o.rad) * .70 + ry * .79;
  const x = o.x + tx * offset, y = o.y + ty * offset;
  const cells = [-1, 1].map(spin => ({
    x: x + nx * rx * .36 * spin,
    y: y + ny * rx * .36 * spin,
    rx: rx * .52, ry: ry * .72, spin
  }));
  return {x, y, rx, ry, tx, ty, nx, ny, angle: Math.atan2(ny, nx), cells};
}

function sampleCurrent(x, y) {
  const channel = currentChannel(x, y);
  const fm = flowMultiplier(y);
  const bankDistance = Math.abs(channel.across * 2 - 1);
  // Faster outside (Prallhang), slower inside (Gleithang). This tilts the
  // entire smooth profile and shifts its fastest lane towards the outer bank.
  // Both banks still slow down from friction; peak speed rises only modestly.
  const profile = (.34 + .66 * Math.pow(Math.max(0, 1 - bankDistance * bankDistance), .65)) *
    (1 + .43 * channel.bankBias);
  const constriction = Math.max(.86, Math.min(1.24, Math.sqrt((riverWidth || channel.width) / channel.width)));
  const speed = Math.abs(BASE_FLOW) * difficulty * fm * profile * constriction;
  const baseX = channel.tx * speed, baseY = channel.ty * speed;
  let vx = baseX, vy = baseY, eddy = 0;
  let wakeWeight = 0, wakeDX = 0, wakeDY = 0;

  for (const rock of obstacles) {
    if (rock.type !== 'rock') continue;
    // Cheap broad phase keeps particle sampling inexpensive.
    const reach = rock.rad * 8 + 56;
    if (Math.abs(y - rock.y) > reach || Math.abs(x - rock.x) > reach) continue;
    const g = getEddyGeometry(rock);
    const dx = x - g.x, dy = y - g.y;
    const u = dx * g.nx + dy * g.ny;
    const v = dx * g.tx + dy * g.ty;
    const uu = u / g.rx, vv = v / g.ry;
    const q = uu * uu + vv * vv;
    if (q < 1) {
      // Compact streamfunction psi = A*u*(1-q)^3 creates two counter-rotating
      // cells. A gentle low-water floor makes the upstream return noticeable
      // from the first stretch; its cap keeps forward paddling able to escape.
      // Velocity and its first derivative fade to zero at the wake edge.
      const shell = (1 - q) * (1 - q);
      const amplitude = Math.min(1.85, .55 + speed * .86);
      const lateral = -6 * amplitude * u * v / (g.ry * g.ry) * shell;
      const downstream = -amplitude * shell * (1 - q - 6 * uu * uu);
      wakeWeight += shell;
      wakeDX += -baseX * shell * .90 + g.nx * lateral + g.tx * downstream;
      wakeDY += -baseY * shell * .90 + g.ny * lateral + g.ty * downstream;
      eddy = Math.max(eddy, shell);
    }

    // Approaching water divides gently around the upstream rock shoulder.
    const rx = x - rock.x, ry = y - rock.y;
    const across = rx * g.nx + ry * g.ny;
    const along = rx * g.tx + ry * g.ty;
    const radius = Math.max(rock.rad, rock.radX || rock.rad);
    if (along < 0 && along > -radius * 3 && Math.abs(across) < radius * 2.4) {
      const approach = Math.sin(Math.PI * (-along / (radius * 3)));
      const side = Math.tanh(across / (radius * .5));
      const shoulder = Math.pow(1 - Math.abs(across) / (radius * 2.4), 2);
      const deflection = speed * .62 * approach * shoulder * side;
      vx += g.nx * deflection;
      vy += g.ny * deflection;
    }
  }
  // Blend overlapping wakes continuously, with bounded total influence.
  const wakeNorm = Math.max(1, wakeWeight);
  vx += wakeDX / wakeNorm;
  vy += wakeDY / wakeNorm;
  // Rocks close to a bank may overlap its waterline. Fade only the cross-bank
  // component there: the final velocity is exactly tangent at either bank.
  const nx = -channel.ty, ny = channel.tx;
  const bankClearance = Math.min(channel.across, 1 - channel.across) * channel.width;
  const bankT = Math.min(1, Math.max(0, bankClearance / 24));
  const bankEnvelope = bankT * bankT * (3 - 2 * bankT);
  const along = vx * channel.tx + vy * channel.ty;
  const lateral = (vx * nx + vy * ny) * bankEnvelope;
  vx = channel.tx * along + nx * lateral;
  vy = channel.ty * along + ny * lateral;
  return {
    x: vx, y: vy, speed: Math.hypot(vx, vy), eddy,
    bend: channel.bend, bankBias: channel.bankBias, returnFlow: along < -.01,
    rapid: Math.max(0, Math.min(1, (fm - 1.02) / .40)) * (1 - eddy * .85)
  };
}

function isInEddy(wx, wy) {
  return sampleCurrent(wx, wy).eddy > 0.12;
}

function handleInput() {
  if (player.capsized || gameOver) return;
  const flow = sampleCurrent(player.x, player.y);
  player.currentFlow = flow;
  const s = 2.75 * (1 - flow.rapid * 0.16);

  // Eingabe-Achsen: Joystick analog ([-1..1]), Tastatur als ±1 (binär).
  // Wenn der Joystick aktiv ist, übersteuert er die Tastatur.
  let ax, ay;
  if (joyActive) {
    ax = joyX; ay = joyY;
  } else {
    ax = keys.ArrowRight ? 1 : keys.ArrowLeft ? -1 : 0;
    ay = keys.ArrowDown  ? 1 : keys.ArrowUp   ? -1 : 0;
  }
  // Tap navigation uses the same paddle forces and animation as other controls.
  if (!joyActive && touchTargetX !== null && touchTargetY !== null) {
    const dx = touchTargetX - player.x, dy = touchTargetY - player.y;
    const d = Math.hypot(dx, dy);
    const arrival = Math.min(1, Math.max(0, (d - 4) / 36));
    ax = d > 4 ? dx / d * arrival : 0;
    ay = d > 4 ? dy / d * arrival : 0;
  }
  const forwardMag = Math.max(0, -ay);   // [0..1]
  const reverseMag = Math.max(0,  ay);   // [0..1]
  const steerMag   = Math.abs(ax);        // [0..1]

  // Paddel-Rhythmus: Tempo und Amplitude skalieren mit der Input-Stärke.
  // Vorwärts = lange, ruhige Schläge; Rückwärts = kürzere, schnellere Schläge;
  // reine Lenkung = moderate Bewegung. Kein Input → Paddel gleitet in Ruhelage.
  if (typeof player.paddlePhase !== 'number' || !isFinite(player.paddlePhase)) player.paddlePhase = 0;
  if (typeof player.paddleAmp !== 'number' || !isFinite(player.paddleAmp)) player.paddleAmp = 0;
  let stroke = 0, targetAmp = 0;
  if (forwardMag > 0.05) {
    stroke    = 0.14 * forwardMag;
    targetAmp = MAX_PADDLE * forwardMag;
  } else if (reverseMag > 0.05) {
    stroke    = 0.28 * reverseMag;
    targetAmp = MAX_PADDLE * 0.55 * reverseMag;
  } else if (steerMag > 0.05) {
    stroke    = 0.17 * steerMag;
    targetAmp = MAX_PADDLE * 0.85 * steerMag;
  }
  if (stroke > 0) {
    player.paddlePhase += stroke;
    player.paddleAmp = player.paddleAmp * 0.7 + targetAmp * 0.3;
  } else {
    player.paddleAmp *= 0.85;
    const nearestZero = Math.round(player.paddlePhase / Math.PI) * Math.PI;
    player.paddlePhase = player.paddlePhase * 0.88 + nearestZero * 0.12;
  }


  // Paddle effort is relative to the local water. A short acceleration phase
  // gives the loaded family kayak weight, while steering remains responsive.
  // Reverse paddling brakes strong current and can travel upstream in quiet water.
  const targetVX = flow.x + ax * s;
  const targetVY = flow.y - forwardMag * 2.10 + reverseMag * 1.36;
  const steeringResponse = steerMag > 0.04 ? 0.19 : 0.095;
  const paddleResponse = forwardMag + reverseMag > 0.04 ? 0.15 : 0.085;
  player.vx += (targetVX - player.vx) * steeringResponse;
  player.vy += (targetVY - player.vy) * paddleResponse;
}

// A floating hull is wider when it turns. Check its whole rotated outline
// against the curved banks, keeping the empty boat and paddle on the water.
function floatingBodyLimits(y, halfW, halfH, angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  const corners = [[-halfW,-halfH],[halfW,-halfH],[halfW,halfH],[-halfW,halfH]]
    .map(([x,dy]) => [x*c-dy*s,x*s+dy*c]);
  let left = -Infinity, right = Infinity;
  for (let edge=0; edge<4; edge++) {
    const a=corners[edge], b=corners[(edge+1)%4];
    const steps=Math.max(1,Math.ceil(Math.abs(b[1]-a[1])/3));
    for (let i=0;i<=steps;i++) {
      const t=i/steps, dx=a[0]+(b[0]-a[0])*t, dy=a[1]+(b[1]-a[1])*t;
      const [L,R]=waterEdges(y+dy);
      left=Math.max(left,L+3-dx); right=Math.min(right,R-3-dx);
    }
  }
  return [left,right];
}

function fitFloatingBody(x, y, halfW, halfH, angle) {
  const [upL,upR]=waterEdges(y+18), [dnL,dnR]=waterEdges(y-18);
  const slope=((upL+upR)-(dnL+dnR))/72;
  const tangent=-Math.atan(slope)+(halfW>halfH?Math.PI/2:0);
  // Axial symmetry lets an empty boat align either bow-first or stern-first.
  const turn=Math.atan2(Math.sin(2*(tangent-angle)),Math.cos(2*(tangent-angle)))/2;
  const [L,R]=waterEdges(y);
  const squeeze=Math.max(0,Math.min(1,(Math.max(halfW,halfH)*2+28-(R-L))/40));
  angle+=turn*squeeze*.045;
  let limits=floatingBodyLimits(y,halfW,halfH,angle);
  if(limits[0]>limits[1]) {
    // A narrow channel cannot hold a sideways hull. Find the nearest fitting
    // orientation toward the local river tangent, instead of pushing onto land.
    const correction=Math.atan2(Math.sin(2*(tangent-angle)),Math.cos(2*(tangent-angle)))/2;
    let lo=0,hi=1;
    for(let i=0;i<12;i++) {
      const mid=(lo+hi)/2, test=floatingBodyLimits(y,halfW,halfH,angle+correction*mid);
      if(test[0]<=test[1])hi=mid;else lo=mid;
    }
    angle+=correction*hi;
    limits=floatingBodyLimits(y,halfW,halfH,angle);
  }
  return {x:limits[0]<=limits[1]?Math.max(limits[0],Math.min(limits[1],x)):(limits[0]+limits[1])/2,angle};
}

function update() {
  updateFlowVisuals();
  if (gameOver) {
    // The river keeps moving while the camera and campsite stay anchored.
    tick++;
    const playerFlow = sampleCurrent(player.x, player.y);
    player.y += playerFlow.y;
    const baseAngle=player.beachSide==='L'?-Math.PI/2.4:Math.PI/2.4;
    const hull=fitFloatingBody(player.x+playerFlow.x,player.y,18,player.h/2+11,
      baseAngle+(player.gameOverRot||0)+(player.gameOverRotSpeed||.012));
    player.x=hull.x;
    player.gameOverRot=hull.angle-baseAngle;
    // No screen-edge clamp: both objects can drift naturally out of view.
    if (player.paddleY != null) {
      const paddleFlow = sampleCurrent(player.paddleX, player.paddleY);
      player.paddleY += paddleFlow.y;
      const paddle=fitFloatingBody(player.paddleX+paddleFlow.x+(player.paddleDriftX||0),
        player.paddleY,42,5,(player.paddleRot||0)+(player.paddleRotSpeed||0));
      player.paddleX=paddle.x;
      player.paddleRot=paddle.angle;
      player.paddleDriftX=(player.paddleDriftX||0)*.985;
    }
    // Collectibles und Hindernisse treiben mit voller Strömung, auch im Kehrwasser.
    collectibles.forEach(item => {
      const localFlow = sampleCurrent(item.x, item.y);
      item.x += localFlow.x;
      item.y += localFlow.y;
      const [itemL, itemR] = waterEdges(item.y);
      item.x = Math.max(itemL + 18, Math.min(itemR - 18, item.x));
      item.rot += item.rotSpeed;
    });
    obstacles.forEach(o => {
      if (o.type === 'log') {
        const localFlow = sampleCurrent(o.x, o.y);
        o.vy = localFlow.y;
        o.x += localFlow.x;
        o.y += o.vy;
        const [logL, logR] = waterEdges(o.y);
        const logMargin = Math.min(o.len * 0.45, (logR - logL) / 2 - 4);
        o.x = Math.max(logL + logMargin, Math.min(logR - logMargin, o.x));
        o.rot += o.rotSpeed;
      }
      // Felsen sind statisch
    });
    // Polizeiboote fahren auch bei Game Over weiter.
    policeBoats.forEach(boat => {
      boat.y += boat.vy;
      boat.blinkPhase++;
      const [pL, pR] = waterEdges(boat.y);
      boat.x = Math.max(pL + boat.w / 2, Math.min(pR - boat.w / 2, boat.x));
    });
    purge(policeBoats);
    // Sirene updaten, damit sie verstummt sobald alle Polizeiboote aus dem Bild sind.
    updatePoliceSiren();
    // Spritzer weiter animieren
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      if (s.kind === 'ring') {
        s.r += 1.2;
        s.life--;
      } else {
        s.x += s.vx;
        s.y += s.vy;
        s.vy += s.kind === 'foam' ? 0.08 : 0.18;
        s.vx *= 0.98;
        s.life--;
      }
      if (s.life <= 0) splashes.splice(i, 1);
    }
    return;
  }
  // Ease both water speed and river narrowing when a score level changes.
  difficulty += (computeDifficulty() - difficulty) * 0.018;
  handleInput();

  if (!player.capsized) {
    player.x += player.vx;
    player.y += player.vy;
  } else {
    // Capsized family and kayak drift together through the same current field.
    const flow = sampleCurrent(player.x, player.y);
    player.vx += (flow.x - player.vx) * 0.12;
    player.vy += (flow.y - player.vy) * 0.12;
    player.x += player.vx;
    player.y += player.vy;
    const [L, R] = waterEdges(player.y);
    player.x = Math.max(L + player.w / 2, Math.min(R - player.w / 2, player.x));
  }

  distance = Math.max(0, startY - player.y);

  checkCollisions();
  if (!gameOver) camY = player.y - HEIGHT * 0.4;

  if (player.capsized && tick - player.capsizeTime > 120) {
    player.capsized = false;
    resetHullContact();
    const [L, R] = waterEdges(player.y);
    player.x = (L + R) / 2;
    player.invulnerable = true;
    player.invulnerableTime = tick;
  }

  if (player.invulnerable && tick - player.invulnerableTime > 210) {
    player.invulnerable = false;
  }

  tick++;

  updateEncounterPacing();
  if (tick % 40 === 0) spawnTree();

  checkCollection();
  checkFishCollection();
  checkFishermanCollision();

  fishes.forEach(fish => {
    const dx = player.x - fish.x;
    const dy = player.y - fish.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 5) {
      fish.x += (dx / dist) * fish.speed;
      fish.y += (dy / dist) * fish.speed;
    }
    const [L, R] = waterEdges(fish.y);
    // Körper ~58 px breit (Pfad -72..+82 * scale 0.4), Clamp großzügig damit
    // der Delfin nicht mit dem Schwanz/der Schnauze ins Ufer ragt.
    fish.x = Math.max(L + 40, Math.min(R - 40, fish.x));
    // Wenn die Fluss-Mitte außerhalb des Flusses wäre (Fluss zu schmal),
    // Delfin in die Mitte schieben.
    if (L + 40 > R - 40) fish.x = (L + R) / 2;
  });

  // Polizeiboote — State-Machine: normal → back up → charge → jump → normal.
  // Trifft ein Boot einen Stein, rutscht es erst zurück, nimmt dann Anlauf
  // und schanzt sichtbar (Bogen via jumpOffset) über den Felsen.
  policeBoats.forEach(boat => {
    if (boat.jumpState == null) { boat.jumpState = 0; boat.jumpTimer = 0; boat.jumpOffset = 0; }
    boat.blinkPhase++;

    if (boat.jumpState === 0) {
      // Normal vorwärts
      boat.y += boat.vy;
      let triggerJump = false, targetY = boat.y, targetRad = 30;
      // 1) Stein-Kollision
      for (const rock of obstacles) {
        if (rock.type !== 'rock') continue;
        const dx = boat.x - rock.x, dy = boat.y - rock.y;
        const d2 = dx * dx + dy * dy;
        const minDist = rock.rad + boat.w / 2;
        if (d2 < minDist * minDist) {
          triggerJump = true; targetY = rock.y; targetRad = rock.rad; break;
        }
      }
      // 2) Holz-Kollision (Baumstämme versperren den Weg)
      if (!triggerJump) {
        for (const log of obstacles) {
          if (log.type !== 'log') continue;
          const lx = log.x + Math.sin(tick * 0.05 + log.phase) * 2;
          const dx = boat.x - lx, dy = boat.y - log.y;
          const logR = Math.max(log.len, log.wd) / 2;
          const minD = logR + boat.w / 2;
          if (dx * dx + dy * dy < minD * minD) {
            triggerJump = true; targetY = log.y; targetRad = logR; break;
          }
        }
      }
      // 3) Fluss wird eng: Blick ein paar Frames voraus
      if (!triggerJump) {
        const lookAheadY = boat.y + boat.vy * 6;
        const [lL, lR] = waterEdges(lookAheadY);
        if (lR - lL < boat.w + 18) {
          triggerJump = true; targetY = lookAheadY; targetRad = 22;
        }
      }
      if (triggerJump) {
        boat.jumpState = 1;
        boat.jumpTimer = 0;
        boat.targetRockY = targetY;
        boat.targetRockRad = targetRad;
      }
    } else if (boat.jumpState === 1) {
      // Anlauf zurück: entgegen der Strömungsrichtung (positive y)
      boat.y += Math.abs(boat.vy) * 0.9;
      boat.jumpTimer++;
      if (boat.jumpTimer >= 22) { boat.jumpState = 2; boat.jumpTimer = 0; }
    } else if (boat.jumpState === 2) {
      // Charge: deutlich beschleunigtes Vorpreschen
      boat.y += boat.vy * 1.8;
      boat.jumpTimer++;
      // Kurz vor dem Felsen abheben
      if (Math.abs(boat.y - boat.targetRockY) < boat.targetRockRad + 18 || boat.jumpTimer >= 28) {
        boat.jumpState = 3; boat.jumpTimer = 0;
      }
    } else if (boat.jumpState === 3) {
      // Flug: schnelles Überqueren + Sprungbogen als visueller y-Offset
      boat.y += boat.vy * 2.2;
      const JUMP_DUR = 22;
      boat.jumpOffset = Math.sin((boat.jumpTimer / JUMP_DUR) * Math.PI) * 48;
      boat.jumpTimer++;
      if (boat.jumpTimer >= JUMP_DUR) {
        boat.jumpState = 0; boat.jumpTimer = 0; boat.jumpOffset = 0;
      }
      // Während der Flugphase keine Stein-Kollision.
    }

    // Flussgrenzen einhalten
    const [L, R] = waterEdges(boat.y);
    boat.x = Math.max(L + boat.w / 2, Math.min(R - boat.w / 2, boat.x));
  });

  obstacles.forEach(log => {
    if (log.type === 'log') {
      const localFlow = sampleCurrent(log.x, log.y);
      log.vy = localFlow.y;
      log.y += log.vy;
      log.x += localFlow.x + log.vx;
      log.rot += log.rotSpeed;
      if (Math.random() < 0.01) log.rotSpeed = rand(-0.02, 0.02);

      obstacles.forEach(rock => {
        if (rock.type === 'rock' && rock !== log) {
          const dx = log.x - rock.x;
          const dy = log.y - rock.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const minDist = rock.rad + log.len / 2;
          if (dist < minDist) {
            const angle = Math.atan2(dy, dx);
            log.x += Math.cos(angle) * (minDist - dist + 5) * 0.1;
            log.vx = Math.cos(angle) * 0.5;
            log.rotSpeed = rand(-0.03, 0.03);
          }
        }
      });

      log.vx *= 0.95;
      const [L, R] = waterEdges(log.y);
      const halfDiag = Math.sqrt((log.len / 2) ** 2 + (log.wd / 2) ** 2);
      if (log.x - halfDiag < L + LOG_MARGIN) {
        log.x = L + LOG_MARGIN + halfDiag;
        log.vx = Math.abs(log.vx);
        log.rotSpeed = rand(0.01, 0.03);
      }
      if (log.x + halfDiag > R - LOG_MARGIN) {
        log.x = R - LOG_MARGIN - halfDiag;
        log.vx = -Math.abs(log.vx);
        log.rotSpeed = rand(-0.03, -0.01);
      }
    }
  });

  resolveOverlaps();
  updatePoliceSiren();
  updateWaterNoise();

  purge(obstacles);
  purge(trees);
  purge(fishes);
  purge(fishermen);
  purge(policeBoats);
}

/* Sorgt dafür, dass bewegliche Objekte (Logs, Collectibles, Fische, Polizeiboote)
   sich nicht überlagern. Statische Felsen drücken andere Objekte weg. */
function resolveOverlaps() {
  const items = [];
  obstacles.forEach(o => {
    if (o.type === 'log') items.push({ obj: o, r: Math.max(o.len, o.wd) / 2 * 0.85 });
  });
  collectibles.forEach(c => items.push({ obj: c, r: Math.max(c.w, c.h) / 2 }));
  fishes.forEach(f => items.push({ obj: f, r: Math.max(f.w, f.h) / 2 }));
  policeBoats.forEach(p => items.push({ obj: p, r: Math.max(p.w, p.h) / 2 * 0.9 }));

  for (let pass = 0; pass < 2; pass++) {
    // Paarweise auseinanderdrücken
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        const a = items[i], b = items[j];
        const dx = b.obj.x - a.obj.x, dy = b.obj.y - a.obj.y;
        const d2 = dx * dx + dy * dy;
        const min = a.r + b.r;
        if (d2 < min * min && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const push = (min - d) * 0.5;
          const nx = dx / d, ny = dy / d;
          a.obj.x -= nx * push; a.obj.y -= ny * push;
          b.obj.x += nx * push; b.obj.y += ny * push;
        }
      }
    }
    // Felsen sind unbeweglich, drücken aber andere weg
    obstacles.forEach(rock => {
      if (rock.type !== 'rock') return;
      items.forEach(a => {
        const dx = a.obj.x - rock.x, dy = a.obj.y - rock.y;
        const d2 = dx * dx + dy * dy;
        const min = rock.rad + a.r;
        if (d2 < min * min && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const push = (min - d);
          a.obj.x += (dx / d) * push;
          a.obj.y += (dy / d) * push;
        }
      });
    });
  }
  // Nach den Korrekturen im Wasser halten.
  items.forEach(a => {
    const [L, R] = waterEdges(a.obj.y);
    const m = Math.min(a.r, (R - L - 10) / 2);
    a.obj.x = Math.max(L + m, Math.min(R - m, a.obj.x));
  });
}

/* ---------- Zeichnen ---------- */

function drawRock(o) {
  const x = o.x, y = o.y - camY;
  const rx = o.radX || o.rad, ry = o.radY || o.rad;
  drawEddy(o);
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rockRot || 0);
  const outline = () => {
    ctx.beginPath();
    o.layers[0].pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath();
  };
  ctx.fillStyle = 'rgba(10,48,46,.24)';

function drawLog(o) {
  const x = o.x + Math.sin(tick * .05 + o.phase) * 1.2, y = o.y - camY;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot);
  const half = o.len / 2, thick = o.wd / 2;
  const outline = () => {
    ctx.beginPath();
    ctx.moveTo(-half + 3, -thick * .74);
    ctx.bezierCurveTo(-half * .4, -thick, half * .48, -thick * .82, half - 2, -thick * .72);
    ctx.quadraticCurveTo(half + 1, 0, half - 2, thick * .72);
    ctx.bezierCurveTo(half * .4, thick * .9, -half * .48, thick, -half + 3, thick * .76);
    ctx.quadraticCurveTo(-half - 1, 0, -half + 3, -thick * .74); ctx.closePath();
  };
  ctx.save(); ctx.translate(2, 3); ctx.fillStyle = 'rgba(12,47,41,.24)'; outline(); ctx.fill(); ctx.restore();
  // Short weathered knots stay within the trunk's gameplay footprint.
  ctx.lineCap = 'round'; ctx.strokeStyle = '#65573b'; ctx.lineWidth = 3;
  for (let i = 0; i < 2; i++) {
    const sx = (i ? .24 : -.3) * o.len, side = i ? -1 : 1;
    ctx.beginPath(); ctx.moveTo(sx, side * thick * .45); ctx.lineTo(sx + 6, side * thick * .98); ctx.stroke();
  }
  const bark = ctx.createLinearGradient(0, -thick, 0, thick);
  bark.addColorStop(0, '#af9e71'); bark.addColorStop(.28, '#8c7852'); bark.addColorStop(.65, '#6f6045'); bark.addColorStop(1, '#4d5140');
  ctx.fillStyle = bark; outline(); ctx.fill();
  ctx.strokeStyle = '#556047'; ctx.lineWidth = .8; ctx.stroke();
  ctx.save(); outline(); ctx.clip();
  for (let i = 0; i < 5; i++) {
    const yy = -thick * .66 + i * thick * .32;
    ctx.strokeStyle = i % 2 ? 'rgba(52,51,35,.37)' : 'rgba(216,200,154,.34)'; ctx.lineWidth = i % 2 ? 1 : .8;
    ctx.beginPath(); ctx.moveTo(-half + 6, yy);
    ctx.bezierCurveTo(-half * .35, yy - 1.3, half * .23, yy + 1.5, half - 6, yy - .6); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(67,55,35,.54)'; ctx.lineWidth = .8;
  ctx.beginPath(); ctx.ellipse(-half * .18, thick * .08, 4.5, 2.1, -.1, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(174,180,114,.33)';
  for (let i = 0; i < 4; i++) {
    ctx.beginPath(); ctx.ellipse(half * (.25 + i * .14), -thick * .35 + Math.sin(i * 2) * 1.5, 3.4, 1.6, -.1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  for (const side of [-1, 1]) {
    const ex = side * (half - 3);
    ctx.fillStyle = side < 0 ? '#c0ae7f' : '#a09269';
    ctx.beginPath(); ctx.ellipse(ex, 0, 3, thick * .73, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(94,76,45,.64)'; ctx.lineWidth = .65;
    for (const scale of [.35, .68]) { ctx.beginPath(); ctx.ellipse(ex, 0, 2 * scale, thick * .65 * scale, 0, 0, Math.PI * 2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(ex, -thick * .58); ctx.lineTo(ex + .5, -thick * .05); ctx.stroke();
  }

function drawTree(t) {
  const y = t.y - camY;
  if (y < -t.h || y > HEIGHT + t.h) return;
  let L = Infinity, R = -Infinity;
  for (let wy = t.y; wy <= t.y + t.h; wy += 6) {
    const [eL, eR] = waterEdges(wy); L = Math.min(L, eL); R = Math.max(R, eR);
  }
  let x;
  if (t.side === 'L') { x = Math.max(0, L - t.w - t.off); if (x + t.w > L - 1) return; }
  else { x = Math.min(WIDTH - t.w, R + t.off); if (x < R + 1) return; }
  const cx = x + t.w / 2, ground = y + t.h, trunkTop = ground - t.trunkHeight;
  const seed = t.h * .31 + t.w * .17, shade = Math.min(1.15, Math.max(.85, t.shade));
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.fillStyle = 'rgba(24,47,32,.22)'; ctx.beginPath();
  ctx.ellipse(cx + 2, ground - 1, t.w * .46, Math.max(3, t.h * .06), -.13, 0, Math.PI * 2); ctx.fill();
  const trunkWidth = Math.max(3, t.w * .13);
  const bark = ctx.createLinearGradient(cx - trunkWidth, 0, cx + trunkWidth, 0);
  bark.addColorStop(0, '#938160'); bark.addColorStop(.5, '#756244'); bark.addColorStop(1, '#4e4d36');
  ctx.fillStyle = bark; ctx.beginPath();
  ctx.moveTo(cx - trunkWidth * .42, trunkTop - 3); ctx.lineTo(cx + trunkWidth * .36, trunkTop - 3);
  ctx.lineTo(cx + trunkWidth * .62, ground); ctx.lineTo(cx - trunkWidth * .72, ground); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(208,189,136,.4)'; ctx.lineWidth = .7;
  ctx.beginPath(); ctx.moveTo(cx - trunkWidth * .15, trunkTop + 2); ctx.lineTo(cx - trunkWidth * .23, ground - 3); ctx.stroke();
  if (t.type === 'oval') {
    const crownH = Math.max(14, t.h - t.trunkHeight), cy = y + crownH * .52;
    // An asymmetric cluster of leafy lobes, with a softly shaded inner crown.
    const canopy = ctx.createLinearGradient(cx - t.w * .3, y, cx + t.w * .3, y + crownH);
    canopy.addColorStop(0, `hsl(88,29%,${45 * shade}%)`);
    canopy.addColorStop(.4, `hsl(107,26%,${36 * shade}%)`);
    canopy.addColorStop(1, `hsl(143,25%,${25 * shade}%)`);
    ctx.fillStyle = canopy; ctx.beginPath();
    ctx.ellipse(cx, cy, t.w * .37, crownH * .46, -.07, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + Math.sin(seed) * .2;
      const px = cx + Math.cos(a) * t.w * .23, py = cy + Math.sin(a) * crownH * .26;
      ctx.fillStyle = canopy; ctx.beginPath();
      ctx.ellipse(px, py, t.w * (.22 + .015 * Math.sin(seed + i)), crownH * .22, Math.sin(a) * .2, 0, Math.PI * 2); ctx.fill();
      if (i > 3) {
        ctx.fillStyle = 'rgba(182,195,119,.23)'; ctx.beginPath();
        ctx.ellipse(px - t.w * .03, py - crownH * .025, t.w * .13, crownH * .10, -.3, Math.PI, Math.PI * 2); ctx.fill();
      }
    }
    for (let i = 0; i < 10; i++) {
      const a = i * 2.4 + seed, r = .16 + (i % 3) * .12;
      ctx.fillStyle = i % 3 ? 'rgba(181,194,116,.24)' : 'rgba(27,69,45,.17)';
      ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * t.w * r, cy + Math.sin(a) * crownH * r,
        t.w * .055, crownH * .024, a, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    const bottom = trunkTop + t.trunkHeight * .24, crownH = bottom - y;
    // Seven uneven, curved branch fans replace the old three solid triangles.
    for (let i = 6; i >= 0; i--) {
      const u = i / 6, top = y + crownH * u * .69, base = y + crownH * (.25 + u * .75);
      const half = t.w * (.10 + u * .39), lean = Math.sin(seed + i * 1.3) * t.w * .025;
      ctx.fillStyle = `hsl(${132 - i * 3},${25 + i}%,${(34 - u * 10) * shade}%)`;
      ctx.beginPath(); ctx.moveTo(cx + lean, top);
      ctx.quadraticCurveTo(cx - half * .3, base - crownH * .13, cx - half, base - crownH * .022);
      ctx.quadraticCurveTo(cx - half * .72, base + crownH * .005, cx - half * .48, base - crownH * .022);
      ctx.quadraticCurveTo(cx - half * .15, base + crownH * .035, cx + half * .16, base);
      ctx.quadraticCurveTo(cx + half * .6, base + crownH * .035, cx + half, base - crownH * .034);
      ctx.quadraticCurveTo(cx + half * .3, base - crownH * .13, cx + lean, top); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = `rgba(152,176,109,${.30 - u * .07})`; ctx.lineWidth = Math.max(.7, t.w * .025);
      ctx.beginPath(); ctx.moveTo(cx + lean - 1, top + crownH * .09);
      ctx.quadraticCurveTo(cx - half * .3, base - crownH * .10, cx - half * .76, base - crownH * .032); ctx.stroke();
    }
  }
  ctx.restore();
}

  ctx.fillStyle = isBack ? '#ead08c' : '#676153';
  ctx.beginPath(); ctx.ellipse(-2, -7.4, 2.8, 1.4, -.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f9dab4';
  ctx.beginPath(); ctx.ellipse(0, .7, 1.7, 1.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawKayak() {
  const kayakY = player.y - camY;
  if (gameOver) { drawBeachScene(kayakY); return; }
  ctx.save();
  ctx.fillStyle = 'rgba(13,54,51,.24)';
  ctx.beginPath(); ctx.ellipse(player.x + 4, kayakY + 7, player.w / 2 + 3, player.h / 2 + 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(player.x, kayakY);
  if (!player.capsized && player.contactTicks > 0) {
    // A brief amber water ripple warns of sustained contact without extra HUD text.
    ctx.strokeStyle = `rgba(255,206,112,${.25 + player.contactTicks / HULL_CONTACT_LIMIT * .5})`;
    ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.ellipse(0, 0, player.w / 2 + 6, player.h / 2 + 12, 0, 0, Math.PI * 2); ctx.stroke();
  }
  if (player.capsized) ctx.rotate(Math.PI / 4);
  if (!player.capsized && player.invulnerable && Math.floor(tick / 10) % 2 === 0) ctx.globalAlpha = .5;
  const halfW = player.w / 2, tip = player.h / 2 + 10;
  const hull = ctx.createLinearGradient(-halfW, 0, halfW, 0);
  hull.addColorStop(0, '#824731'); hull.addColorStop(.22, '#c77646');
  hull.addColorStop(.48, player.capsized ? '#d78c54' : '#eca35e'); hull.addColorStop(1, '#a65b3b');
  ctx.fillStyle = hull; ctx.strokeStyle = '#633d2d'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, -tip);
  ctx.quadraticCurveTo(halfW + 5, -player.h / 4, halfW, 0);
  ctx.quadraticCurveTo(halfW + 5, player.h / 4, 0, tip);
  ctx.quadraticCurveTo(-halfW - 5, player.h / 4, -halfW, 0);
  ctx.quadraticCurveTo(-halfW - 5, -player.h / 4, 0, -tip);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#f5c58a'; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(-.8, -tip + 3); ctx.quadraticCurveTo(-halfW - 2, -12, -halfW + 2, 0);
  ctx.quadraticCurveTo(-halfW - 1, 18, -.8, tip - 3); ctx.stroke();
  ctx.strokeStyle = 'rgba(109,61,36,.43)'; ctx.lineWidth = .65;
  ctx.beginPath(); ctx.moveTo(0, -tip + 5); ctx.lineTo(0, tip - 5); ctx.stroke();
  if (!player.capsized) {
    for (const py of [-23, 23]) {
      ctx.fillStyle = '#644537'; ctx.strokeStyle = '#f2bb78'; ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.ellipse(0, py, 9, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#314b46'; ctx.beginPath(); ctx.roundRect(-6, py + 3, 12, 5, 2); ctx.fill();
    }

function getBeachLayout() {
  const side = player.beachSide || 'L';
  const anchorY = player.beachAnchorY ?? player.y;
  let bankSpace = WIDTH;
  for (let dy = -90; dy <= 90; dy += 3) {
    const [left, right] = waterEdges(anchorY + dy);
    bankSpace = Math.min(bankSpace, side === 'L' ? left : WIDTH - right);
  }
  return {side, bankSpace, scale: Math.min(1, Math.max(.1, (bankSpace - 14) / 114)),
    x: side === 'L' ? bankSpace / 2 : WIDTH - bankSpace / 2, y: anchorY - camY};
}

function drawSplashes() {
  splashes.forEach(s => {
    const alpha = s.life / s.maxLife;
    const y = s.y - camY;
    if (s.kind === 'ring') {
      ctx.save();
      ctx.strokeStyle = `rgba(220, 240, 255, ${alpha * 0.7})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(s.x, y, s.r * 1.3, s.r * 0.5, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    } else if (s.kind === 'foam') {
      ctx.fillStyle = `rgba(240, 250, 255, ${alpha * 0.85})`;
      ctx.beginPath();
      ctx.arc(s.x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x - s.r * 0.3, y - s.r * 0.3, s.r * 0.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = `rgba(180, 220, 250, ${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
      ctx.beginPath();
      ctx.arc(s.x - s.r * 0.3, y - s.r * 0.3, s.r * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function drawScorePops() {
  scorePops.forEach(p => {
    const age = tick - p.t;
    const alpha = 1 - age / 60;
    const y = p.y - camY - age * 0.8;
    // Zeichenkette: numerisch bekommt '+', negativ/string (z.B. "-10", "Leben") direkt.
    const label = typeof p.pts === 'number'
      ? (p.pts >= 0 ? '+' + p.pts : String(p.pts))
      : (String(p.pts).startsWith('-') ? String(p.pts) : '+' + p.pts);
    const isPenalty = typeof p.pts === 'string' && p.pts.startsWith('-');
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = isPenalty ? '#eea384' : '#ffe0a2';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = '700 20px system-ui';
    ctx.textAlign = 'center';
    ctx.strokeText(label, p.x, y);
    ctx.fillText(label, p.x, y);
    ctx.restore();
  });
  ctx.textAlign = 'left';
}
